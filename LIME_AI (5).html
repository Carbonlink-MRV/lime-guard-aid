<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIME AI — Kenya National Vaccine Intelligence</title>
<meta name="description" content="LIME AI — Kenya's National Vaccine Intelligence System. Real-time monitoring, AI prediction, and IoT hardware network.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ── DESIGN SYSTEM ────────────────────────────────────────────── */
:root {
  --black: #010508;
  --deep: #030d14;
  --surface: #071620;
  --raised: #0c1e2e;
  --border: #102236;
  --border2: #1a3450;
  --muted: #326080;
  --dim: #4a7898;
  --text: #b8d8e8;
  --bright: #e2f6ff;
  --lime: #b8ff00;
  --lime2: #7ec800;
  --lime3: rgba(184,255,0,0.08);
  --cyan: #00f0d8;
  --cyan2: rgba(0,240,216,0.08);
  --amber: #ffb830;
  --red: #ff3838;
  --blue: #2896ff;
  --purple: #a855f7;
  --teal: #00c9a7;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Plus Jakarta Sans', sans-serif;
  --display: 'Orbitron', sans-serif;
  --r: 10px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --glow-lime: 0 0 20px rgba(184,255,0,0.25);
  --glow-cyan: 0 0 20px rgba(0,240,216,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app{height:100%;overflow:hidden}
body{background:var(--black);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--black)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── LAYOUT ───────────────────────────────────────────────────── */
#app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr}
.sidebar{background:linear-gradient(180deg,#030f1a 0%,#020c15 100%);border-right:1px solid var(--border2);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sidebar::before{content:'';position:absolute;top:-80px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(184,255,0,0.06) 0%,transparent 60%);pointer-events:none}
.sidebar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:250px;background:linear-gradient(transparent,rgba(0,240,216,0.03));pointer-events:none}
.main{display:grid;grid-template-rows:60px 1fr;overflow:hidden}
.topbar{border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 28px;gap:16px;background:rgba(3,13,20,0.95);backdrop-filter:blur(10px)}
.content{overflow-y:auto;padding:28px;background:var(--black)}

/* ── SIDEBAR ──────────────────────────────────────────────────── */
.logo-area{padding:22px 18px 18px;border-bottom:1px solid var(--border2);position:relative}
.logo-text{font-family:var(--display);font-size:20px;font-weight:900;color:var(--lime);letter-spacing:2px;text-shadow:var(--glow-lime)}
.logo-full{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;line-height:1.6}
.ai-status{margin:12px 16px 0;display:flex;align-items:center;gap:7px;padding:8px 10px;background:rgba(170,255,46,0.05);border:1px solid rgba(170,255,46,0.12);border-radius:6px;cursor:pointer;transition:all .2s}
.ai-status:hover{background:rgba(170,255,46,0.09)}
.ai-pulse{width:7px;height:7px;border-radius:50%;background:var(--lime);flex-shrink:0;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(170,255,46,0.6)}50%{box-shadow:0 0 0 5px rgba(170,255,46,0)}}
.ai-status-text{font-family:var(--mono);font-size:10px;color:var(--lime);flex:1}
.ai-learn-count{font-family:var(--mono);font-size:9px;color:var(--lime2)}
.nav-section{padding:8px 10px;margin-top:4px}
.nav-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:0 6px;margin-bottom:6px;margin-top:10px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:all .15s;color:var(--dim);font-size:13px;font-weight:500;position:relative;border:1px solid transparent}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-item.active{color:var(--bright);background:rgba(255,255,255,0.06);border-color:var(--border2)}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--lime);border-radius:0 2px 2px 0}
.nav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.nav-item.active .nav-dot{background:var(--lime)}
.nav-badge{margin-left:auto;padding:1px 7px;border-radius:10px;font-family:var(--mono);font-size:9px;font-weight:700}
.nb-red{background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.25)}
.nb-amber{background:rgba(255,176,32,0.15);color:var(--amber);border:1px solid rgba(255,176,32,0.25)}
.nb-cyan{background:rgba(0,229,204,0.12);color:var(--cyan);border:1px solid rgba(0,229,204,0.2)}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-radius:7px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--black);font-size:12px;flex-shrink:0}
.user-info{flex:1;min-width:0}
.u-name{font-size:12px;font-weight:600;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-role{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ── TOPBAR ───────────────────────────────────────────────────── */
.page-title{font-size:15px;font-weight:700;color:var(--bright)}
.page-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-family:var(--mono);font-size:10px;border:1px solid var(--border2);color:var(--dim)}
.chip.live{color:var(--cyan);border-color:rgba(0,229,204,0.25);background:rgba(0,229,204,0.05)}
.chip.learning{color:var(--lime);border-color:rgba(170,255,46,0.25);background:rgba(170,255,46,0.05);animation:flicker 3s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.7}}
.chip-dot{width:5px;height:5px;border-radius:50%}

/* ── CARDS & GRIDS ────────────────────────────────────────────── */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:13px;font-weight:600;color:var(--bright)}
.card-body{padding:18px}
.stat-card{padding:20px;position:relative;overflow:hidden;transition:border-color .2s}
.stat-card:hover{border-color:var(--border2)}
.stat-card::after{content:'';position:absolute;top:-40px;right:-40px;width:100px;height:100px;border-radius:50%;opacity:.06}
.sc-lime::after{background:var(--lime)}
.sc-cyan::after{background:var(--cyan)}
.sc-amber::after{background:var(--amber)}
.sc-red::after{background:var(--red)}
.sc-purple::after{background:var(--purple)}
.stat-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.stat-val{font-size:32px;font-weight:700;line-height:1;margin-bottom:5px;letter-spacing:-1.5px;font-family:var(--mono)}
.stat-meta{font-size:11px;color:var(--muted)}
.stat-trend{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;margin-top:6px}
.trend-up{background:rgba(170,255,46,0.1);color:var(--lime)}
.trend-dn{background:rgba(255,61,61,0.1);color:var(--red)}
.trend-eq{background:rgba(90,120,144,0.15);color:var(--dim)}

/* ── AI BRAIN PANEL ───────────────────────────────────────────── */
.ai-brain{background:var(--deep);border:1px solid rgba(170,255,46,0.15);border-radius:var(--r);padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
.ai-brain::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--lime),transparent);animation:scan 4s linear infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ai-brain-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ai-brain-icon{font-size:24px}
.ai-brain-title{font-size:16px;font-weight:700;color:var(--lime)}
.ai-brain-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.ai-modules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ai-module{background:rgba(255,255,255,0.03);border:1px solid var(--border2);border-radius:6px;padding:14px;transition:all .2s;cursor:pointer}
.ai-module:hover{background:rgba(255,255,255,0.05);border-color:var(--muted)}
.ai-module.running{border-color:rgba(170,255,46,0.3);background:rgba(170,255,46,0.04)}
.am-icon{font-size:18px;margin-bottom:8px}
.am-name{font-size:12px;font-weight:600;color:var(--bright);margin-bottom:4px}
.am-desc{font-size:10px;color:var(--muted);line-height:1.5}
.am-status{display:flex;align-items:center;gap:5px;margin-top:8px;font-family:var(--mono);font-size:9px}
.am-dot{width:5px;height:5px;border-radius:50%}

/* ── TABLE ────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;background:var(--raised);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid rgba(19,32,48,0.7);font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.015)}
.td-main{font-weight:600;color:var(--bright);font-size:13px}
.td-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}

/* ── BADGES ───────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.b-ok{background:rgba(0,229,204,0.1);color:var(--cyan);border:1px solid rgba(0,229,204,0.2)}
.b-warn{background:rgba(255,176,32,0.1);color:var(--amber);border:1px solid rgba(255,176,32,0.2)}
.b-crit{background:rgba(255,61,61,0.12);color:var(--red);border:1px solid rgba(255,61,61,0.25)}
.b-out{background:rgba(255,61,61,0.2);color:var(--red);border:1px solid var(--red)}
.b-lime{background:rgba(170,255,46,0.1);color:var(--lime);border:1px solid rgba(170,255,46,0.2)}
.b-purple{background:rgba(176,106,255,0.1);color:var(--purple);border:1px solid rgba(176,106,255,0.2)}
.b-dim{background:rgba(90,120,144,0.1);color:var(--dim);border:1px solid var(--border2)}

/* ── PROGRESS ─────────────────────────────────────────────────── */
.progress{height:3px;background:var(--raised);border-radius:2px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:2px;transition:width .5s ease}

/* ── SCORE RING ───────────────────────────────────────────────── */
.score-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:700}

/* ── INSIGHTS ─────────────────────────────────────────────────── */
.insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s;cursor:pointer}
.insight-card:hover{border-color:var(--border2)}
.insight-card.crit{border-left:3px solid var(--red)}
.insight-card.warn{border-left:3px solid var(--amber)}
.insight-card.info{border-left:3px solid var(--cyan)}
.insight-card.good{border-left:3px solid var(--lime)}
.insight-icon{font-size:20px;margin-top:1px;flex-shrink:0}
.insight-title{font-size:13px;font-weight:600;color:var(--bright);margin-bottom:3px}
.insight-body{font-size:12px;color:var(--dim);line-height:1.6}
.insight-meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:6px}
.insight-actions{display:flex;gap:8px;margin-top:8px}

/* ── BUTTONS ──────────────────────────────────────────────────── */
.btn{padding:8px 18px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-lime{background:var(--lime);color:var(--black)}
.btn-lime:hover{background:#c0ff40}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{border-color:var(--muted);color:var(--bright)}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:5px}
.btn-danger{background:rgba(255,61,61,0.12);border:1px solid rgba(255,61,61,0.25);color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── AI CHAT ──────────────────────────────────────────────────── */
.ai-chat{display:flex;flex-direction:column;height:100%;background:var(--deep)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.msg-lime{background:linear-gradient(135deg,var(--lime),var(--cyan))}
.msg-user{background:var(--raised)}
.msg-bubble{background:var(--raised);border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-width:85%;font-size:13px;line-height:1.6}
.msg-bubble.user-bubble{background:rgba(170,255,46,0.07);border-color:rgba(170,255,46,0.15);margin-left:auto}
.msg.user{flex-direction:row-reverse}
.msg-time{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--border)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:8px;font-family:var(--sans);font-size:13px;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5}
.chat-input:focus{border-color:rgba(170,255,46,0.4)}
.quick-asks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qa-chip{padding:5px 11px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;font-size:11px;color:var(--dim);cursor:pointer;transition:all .15s;font-family:var(--mono)}
.qa-chip:hover{border-color:rgba(170,255,46,0.3);color:var(--lime);background:rgba(170,255,46,0.04)}

/* ── MINI CHART ───────────────────────────────────────────────── */
.sparkline{display:flex;align-items:flex-end;gap:2px;height:32px}
.spark-bar{flex:1;border-radius:1px 1px 0 0;min-width:3px;transition:height .3s}

/* ── USSD ─────────────────────────────────────────────────────── */
.phone-shell{width:260px;background:#0d0d0d;border-radius:24px;padding:16px;border:2px solid #222;box-shadow:0 24px 64px rgba(0,0,0,.7)}
.phone-screen{background:#0a1a00;border-radius:10px;padding:14px;min-height:180px;font-family:var(--mono);font-size:11px;color:var(--lime);white-space:pre-wrap;line-height:1.7;margin-bottom:10px;border:1px solid #1a3000}
.phone-input-row{display:flex;gap:6px}
.phone-input{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;padding:7px 10px;border-radius:5px;font-family:var(--mono);font-size:11px;outline:none}
.phone-btn{background:var(--lime);color:var(--black);border:none;padding:7px 12px;border-radius:5px;font-weight:700;cursor:pointer;font-size:11px}

/* ── LEARN PAGE ───────────────────────────────────────────────── */
.model-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;transition:border-color .2s}
.model-card:hover{border-color:var(--border2)}
.model-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.model-icon{font-size:22px}
.model-name{font-size:14px;font-weight:700;color:var(--bright)}
.model-type{font-family:var(--mono);font-size:10px;color:var(--muted)}
.model-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.metric-box{background:var(--raised);border-radius:5px;padding:10px;text-align:center}
.metric-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--bright)}
.metric-label{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.training-bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden;margin-top:10px}
.training-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:3px;animation:train 3s ease-in-out infinite alternate}
@keyframes train{from{width:60%}to{width:95%}}

/* ── INPUT ────────────────────────────────────────────────────── */
.form-group{margin-bottom:14px}
.form-label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;display:block}
.form-input,.form-select{width:100%;background:var(--raised);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:6px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus{border-color:rgba(170,255,46,0.4)}
.success-box{background:rgba(170,255,46,0.07);border:1px solid rgba(170,255,46,0.2);color:var(--lime);padding:10px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;margin-bottom:14px}
.error-box{background:rgba(255,61,61,0.07);border:1px solid rgba(255,61,61,0.2);color:var(--red);padding:10px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;margin-bottom:14px}

/* ── LOGIN ────────────────────────────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);position:relative;overflow:hidden}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(16,34,54,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(16,34,54,.5) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.login-glow{position:absolute;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(184,255,0,0.055),transparent 60%);pointer-events:none}
.login-glow2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,216,0.04),transparent 60%);pointer-events:none;right:-100px;bottom:-100px}
.login-box{position:relative;width:420px;background:linear-gradient(145deg,rgba(7,22,32,0.98),rgba(3,13,20,0.99));border:1px solid var(--border2);border-radius:20px;padding:48px 40px;box-shadow:0 40px 100px rgba(0,0,0,0.7),0 0 0 1px rgba(184,255,0,0.06) inset}
.login-logo{text-align:center;margin-bottom:40px}
.ll-mark{font-family:var(--display);font-size:44px;font-weight:900;color:var(--lime);letter-spacing:6px;line-height:1;text-shadow:0 0 40px rgba(184,255,0,0.5),0 0 80px rgba(184,255,0,0.2)}
.ll-sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:10px}
.ll-version{display:inline-block;margin-top:10px;padding:4px 14px;background:rgba(184,255,0,0.07);border:1px solid rgba(184,255,0,0.2);border-radius:20px;font-family:var(--mono);font-size:9px;color:var(--lime2);letter-spacing:1px}

<body>

<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  LIME AI ENGINE — Core Intelligence System
// ═══════════════════════════════════════════════════════════════

const LIME = (() => {

// ── DATA LAYER ─────────────────────────────────────────────────
const HOSPITALS = [
  {id:1,name:"Kenyatta National Hospital",county:"Nairobi",district:"Nairobi Central",level:"level5"},
  {id:2,name:"Kisumu County Hospital",county:"Kisumu",district:"Kisumu Central",level:"level4"},
  {id:3,name:"Mombasa County Hospital",county:"Mombasa",district:"Mombasa",level:"level4"},
  {id:4,name:"Nakuru Level 5 Hospital",county:"Nakuru",district:"Nakuru",level:"level5"},
  {id:5,name:"Eldoret Referral Hospital",county:"Uasin Gishu",district:"Eldoret",level:"level5"},
  {id:6,name:"Garissa County Hospital",county:"Garissa",district:"Garissa",level:"level4"},
  {id:7,name:"Machakos Level 5 Hospital",county:"Machakos",district:"Machakos",level:"level4"},
  {id:8,name:"Kakamega County Hospital",county:"Kakamega",district:"Kakamega",level:"level4"},
];

const VACCINES = [
  {id:1,name:"BCG",doses:1,interval:0,targetAge:"Birth"},
  {id:2,name:"OPV",doses:4,interval:28,targetAge:"0-14 weeks"},
  {id:3,name:"DTP-HepB-Hib",doses:3,interval:28,targetAge:"6-14 weeks"},
  {id:4,name:"PCV",doses:3,interval:28,targetAge:"6-14 weeks"},
  {id:5,name:"Rotavirus",doses:2,interval:28,targetAge:"6-10 weeks"},
  {id:6,name:"MR",doses:2,interval:180,targetAge:"9-18 months"},
  {id:7,name:"Yellow Fever",doses:1,interval:0,targetAge:"9 months"},
  {id:8,name:"HPV",doses:2,interval:180,targetAge:"10 years"},
  {id:9,name:"COVID-19",doses:2,interval:21,targetAge:"18+ years"},
  {id:10,name:"Tetanus Toxoid",doses:5,interval:28,targetAge:"Maternal"},
];

// Generate rich synthetic data
function generateData() {
  const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const today = new Date();
  const dateStr = d => d.toISOString().split('T')[0];
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

  // Stock: varied reality — some critical, some expiring, some healthy
  const stock = [];
  let sid = 1;
  HOSPITALS.forEach(h => {
    VACCINES.forEach(v => {
      const batches = rand(1,3);
      for(let b=0;b<batches;b++){
        const qty = rand(0,600);
        const expDays = b===0 ? rand(-15,400) : rand(30,500);
        stock.push({
          id:sid++, hospitalId:h.id, vaccineId:v.id,
          batch:`BAT-${h.id}${v.id}${rand(100,999)}`,
          quantity:qty, expiryDate:dateStr(addDays(today,expDays)),
          receivedDate:dateStr(addDays(today,-rand(1,90)))
        });
      }
    });
  });

  // Administration history: 90 days, with weekly seasonality
  const admins = [];
  let aid = 1;
  for(let day=89;day>=0;day--){
    const date = addDays(today,-day);
    const dow = date.getDay(); // weekly pattern: busier Mon-Fri
    const weekMultiplier = (dow===0||dow===6) ? 0.3 : 1;
    HOSPITALS.forEach(h => {
      VACCINES.slice(0,7).forEach(v => {
        const base = rand(2,12) * weekMultiplier;
        const count = Math.floor(base + (Math.random()>0.8?rand(3,10):0)); // occasional spikes
        for(let i=0;i<count;i++){
          admins.push({
            id:aid++, hospitalId:h.id, vaccineId:v.id,
            stockId:1, nurseId:1,
            patientId:`PAT-${rand(10000,99999)}`,
            patientAge:rand(0,36),
            doseNumber:rand(1,3),
            administeredAt:dateStr(date)
          });
        }
      });
    });
  }

  return { stock, admins };
}

const { stock, admins } = generateData();

// ── AI ENGINE ──────────────────────────────────────────────────
// This is the LIME AI brain — it learns from data patterns

class AIEngine {
  constructor() {
    this.models = {}; // trained models per hospital+vaccine
    this.anomalies = [];
    this.predictions = {};
    this.evaluations = {};
    this.learningCycles = 0;
    this.lastTrained = null;
    this.train();
  }

  // LEARN: Build usage models from historical data
  train() {
    const today = new Date();
    this.learningCycles++;
    this.lastTrained = new Date();

    HOSPITALS.forEach(h => {
      VACCINES.forEach(v => {
        const key = `${h.id}_${v.id}`;
        const hv = admins.filter(a => a.hospitalId===h.id && a.vaccineId===v.id);

        if(hv.length < 3) {
          this.models[key] = { dailyRate:0.5, trend:'stable', confidence:30, r2:0.3, samples:hv.length };
          return;
        }

        // Group by day
        const byDay = {};
        hv.forEach(a => {
          byDay[a.administeredAt] = (byDay[a.administeredAt]||0) + 1;
        });
        const days = Object.values(byDay);

        // Calculate rolling average (weighted — recent data matters more)
        const recentDays = days.slice(-14);
        const olderDays = days.slice(-30,-14);
        const recentAvg = recentDays.length ? recentDays.reduce((s,x)=>s+x,0)/recentDays.length : 0;
        const olderAvg = olderDays.length ? olderDays.reduce((s,x)=>s+x,0)/olderDays.length : recentAvg;

        // Trend detection
        const trendRatio = olderAvg > 0 ? recentAvg/olderAvg : 1;
        const trend = trendRatio > 1.15 ? 'increasing' : trendRatio < 0.85 ? 'decreasing' : 'stable';

        // Weighted daily rate (60% recent, 40% historical)
        const dailyRate = recentAvg * 0.6 + olderAvg * 0.4;

        // Confidence: based on data volume + consistency
        const variance = days.reduce((s,x)=>s+Math.pow(x-dailyRate,2),0)/days.length;
        const cv = dailyRate > 0 ? Math.sqrt(variance)/dailyRate : 1;
        const confidence = Math.min(95, Math.max(30, Math.round(80 - cv*20)));

        // Pseudo R² — how well linear model fits
        const r2 = Math.min(0.99, Math.max(0.1, 1 - cv*0.4));

        // Weekly seasonality index
        const dowTotals = Array(7).fill(0);
        const dowCounts = Array(7).fill(0);
        hv.forEach(a => {
          const dow = new Date(a.administeredAt).getDay();
          dowTotals[dow]++;
          dowCounts[dow]++;
        });
        const seasonality = dowTotals.map((t,i) => dowCounts[i]>0 ? t/dowCounts[i]/dailyRate : 1);

        this.models[key] = { dailyRate, trend, confidence, r2, samples:hv.length, seasonality, trendRatio };
      });
    });

    // DETECT ANOMALIES
    this.detectAnomalies();
    // GENERATE PREDICTIONS
    this.generatePredictions();
    // EVALUATE HOSPITALS
    this.evaluateHospitals();
  }

  // MONITOR: Detect anomalies in consumption patterns
  detectAnomalies() {
    this.anomalies = [];
    const today = new Date();
    const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
    const dateStr = d => d.toISOString().split('T')[0];

    HOSPITALS.forEach(h => {
      VACCINES.forEach(v => {
        const key = `${h.id}_${v.id}`;
        const model = this.models[key];
        if(!model || model.samples < 5) return;

        // Check last 7 days vs model
        const recentAdmins = admins.filter(a =>
          a.hospitalId===h.id && a.vaccineId===v.id &&
          new Date(a.administeredAt) >= addDays(today,-7)
        );

        const byDay = {};
        recentAdmins.forEach(a => { byDay[a.administeredAt]=(byDay[a.administeredAt]||0)+1; });
        const recentDays = Object.values(byDay);

        if(recentDays.length < 2) return;

        const recentAvg = recentDays.reduce((s,x)=>s+x,0)/recentDays.length;
        const expectedAvg = model.dailyRate;
        const ratio = expectedAvg > 0 ? recentAvg/expectedAvg : 1;

        if(ratio > 2.2) {
          this.anomalies.push({
            type:'spike', severity:'critical',
            hospitalId:h.id, vaccineId:v.id,
            message:`Unusual consumption spike: ${recentAvg.toFixed(1)} doses/day vs expected ${expectedAvg.toFixed(1)}`,
            detail:`${Math.round((ratio-1)*100)}% above normal — possible outbreak signal`,
            ratio, confidence:model.confidence
          });
        } else if(ratio < 0.25 && expectedAvg > 2) {
          this.anomalies.push({
            type:'drop', severity:'warning',
            hospitalId:h.id, vaccineId:v.id,
            message:`Sudden consumption drop detected`,
            detail:`Only ${recentAvg.toFixed(1)} doses/day vs expected ${expectedAvg.toFixed(1)} — possible stock issue or disruption`,
            ratio, confidence:model.confidence
          });
        }
      });
    });
  }

  // PREDICT: Multi-factor forecasting
  generatePredictions() {
    const today = new Date();
    const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

    HOSPITALS.forEach(h => {
      VACCINES.forEach(v => {
        const key = `${h.id}_${v.id}`;
        const model = this.models[key];

        // Current valid stock
        const validStock = stock.filter(s =>
          s.hospitalId===h.id && s.vaccineId===v.id &&
          new Date(s.expiryDate) > today && s.quantity > 0
        );
        const totalQty = validStock.reduce((s,x)=>s+x.quantity,0);
        const earliestExpiry = validStock.reduce((min,s) =>
          !min || new Date(s.expiryDate) < new Date(min) ? s.expiryDate : min, null);

        const dailyRate = model ? model.dailyRate : 0.5;
        const trend = model ? model.trend : 'stable';

        // Adjust daily rate by trend projection
        let projectedRate = dailyRate;
        if(trend === 'increasing') projectedRate *= 1.15;
        if(trend === 'decreasing') projectedRate *= 0.85;

        let daysUntilStockout = null;
        let riskLevel = 'ok';
        if(projectedRate > 0 && totalQty > 0) {
          daysUntilStockout = Math.round(totalQty / projectedRate);
          if(daysUntilStockout <= 5) riskLevel = 'critical';
          else if(daysUntilStockout <= 14) riskLevel = 'warning';
        } else if(totalQty === 0) {
          daysUntilStockout = 0;
          riskLevel = 'stockout';
        }

        // Expiry risk
        let expiryRisk = 'none';
        if(earliestExpiry) {
          const daysToExpiry = Math.round((new Date(earliestExpiry)-today)/(86400000));
          if(daysToExpiry <= 7) expiryRisk = 'critical';
          else if(daysToExpiry <= 21) expiryRisk = 'warning';
          else if(daysToExpiry <= 45) expiryRisk = 'watch';
        }

        // Future demand forecast (7-day)
        const forecast7 = Array.from({length:7},(_,i) => {
          const d = addDays(today, i+1);
          const dow = d.getDay();
          const seasonal = model?.seasonality?.[dow] || 1;
          return Math.max(0, Math.round(projectedRate * seasonal));
        });

        this.predictions[key] = {
          hospitalId:h.id, vaccineId:v.id,
          currentStock:totalQty, dailyRate:projectedRate.toFixed(1),
          daysUntilStockout, riskLevel, earliestExpiry, expiryRisk,
          trend, confidence: model?.confidence||30,
          forecast7, trendRatio: model?.trendRatio||1
        };
      });
    });
  }

  // EVALUATE: Score hospital performance
  evaluateHospitals() {
    const today = new Date();
    const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

    HOSPITALS.forEach(h => {
      let metrics = {
        stockCoverage: 0, expiryMgmt: 0, utilizationRate: 0,
        alertScore: 0, consistencyScore: 0
      };

      // Stock coverage: % vaccines with >14 days stock
      const preds = VACCINES.map(v => this.predictions[`${h.id}_${v.id}`]);
      const wellStocked = preds.filter(p => p && p.daysUntilStockout !== null && p.daysUntilStockout > 14).length;
      metrics.stockCoverage = Math.round((wellStocked/VACCINES.length)*100);

      // Expiry management: % batches not expiring in 14 days
      const hStock = stock.filter(s => s.hospitalId===h.id && s.quantity>0);
      const goodBatches = hStock.filter(s => new Date(s.expiryDate) > addDays(today,14));
      metrics.expiryMgmt = hStock.length>0 ? Math.round((goodBatches.length/hStock.length)*100) : 80;

      // Utilization: actual vs capacity
      const recentAdmins = admins.filter(a => a.hospitalId===h.id && new Date(a.administeredAt)>=addDays(today,-30));
      metrics.utilizationRate = Math.min(100, Math.round(recentAdmins.length/2));

      // Consistency score from model confidence
      const avgConf = preds.filter(p=>p).reduce((s,p)=>s+(p.confidence||50),0) / (preds.length||1);
      metrics.consistencyScore = Math.round(avgConf);

      // Alert score: fewer critical alerts = better
      const criticals = preds.filter(p => p && (p.riskLevel==='critical'||p.riskLevel==='stockout')).length;
      metrics.alertScore = Math.max(0, 100 - criticals*15);

      const overall = Math.round(
        metrics.stockCoverage*0.3 +
        metrics.expiryMgmt*0.2 +
        metrics.utilizationRate*0.2 +
        metrics.consistencyScore*0.15 +
        metrics.alertScore*0.15
      );

      const grade = overall >= 85 ? 'A' : overall >= 70 ? 'B' : overall >= 55 ? 'C' : overall >= 40 ? 'D' : 'F';

      this.evaluations[h.id] = { ...metrics, overall, grade, hospitalId:h.id };
    });
  }

  getSystemStats() {
    const preds = Object.values(this.predictions);
    const today = new Date();
    const validStock = stock.filter(s => new Date(s.expiryDate)>today && s.quantity>0);
    const totalDoses = validStock.reduce((s,x)=>s+x.quantity,0);
    const criticals = preds.filter(p=>p.riskLevel==='critical'||p.riskLevel==='stockout').length;
    const expiringSoon = stock.filter(s=>{
      const d = Math.round((new Date(s.expiryDate)-today)/86400000);
      return d>0 && d<=30 && s.quantity>0;
    }).length;
    const anomalyCount = this.anomalies.length;
    const totalAdmins7 = admins.filter(a=>new Date(a.administeredAt)>=new Date(Date.now()-7*86400000)).length;
    const avgScore = Object.values(this.evaluations).reduce((s,e)=>s+e.overall,0)/HOSPITALS.length;
    return { totalDoses, criticals, expiringSoon, anomalyCount, totalAdmins7, avgScore:Math.round(avgScore), learningCycles:this.learningCycles };
  }

  getTopInsights() {
    const insights = [];
    const today = new Date();
    const preds = Object.values(this.predictions);

    // Critical stockouts
    preds.filter(p=>p.riskLevel==='stockout').slice(0,2).forEach(p => {
      const h = HOSPITALS.find(x=>x.id===p.hospitalId);
      const v = VACCINES.find(x=>x.id===p.vaccineId);
      insights.push({type:'crit',icon:'🔴',title:`STOCKOUT: ${v?.name} at ${h?.name}`,body:`Zero valid doses available. Immediate restock required.`,action:'Request Restock'});
    });

    // Critical soon
    preds.filter(p=>p.riskLevel==='critical').slice(0,2).forEach(p => {
      const h = HOSPITALS.find(x=>x.id===p.hospitalId);
      const v = VACCINES.find(x=>x.id===p.vaccineId);
      insights.push({type:'crit',icon:'⚠️',title:`Critical: ${v?.name} — ${p.daysUntilStockout} days left at ${h?.name}`,body:`Based on ${p.dailyRate} doses/day trend. ${p.trend==='increasing'?'Usage is increasing — stock will deplete faster.':''}`,action:'Alert District'});
    });

    // Anomalies
    this.anomalies.slice(0,2).forEach(a => {
      const h = HOSPITALS.find(x=>x.id===a.hospitalId);
      const v = VACCINES.find(x=>x.id===a.vaccineId);
      insights.push({type:'warn',icon:'📡',title:`Anomaly: ${v?.name} at ${h?.name}`,body:a.detail,action:'Investigate'});
    });

    // Good news
    const healthy = preds.filter(p=>p.riskLevel==='ok' && p.daysUntilStockout>60);
    if(healthy.length > 20) insights.push({type:'good',icon:'✅',title:`${healthy.length} vaccine-hospital combos well-stocked`,body:'Over 60 days of supply with current usage rates. No immediate action needed.',action:null});

    return insights.slice(0,6);
  }
}

// ── ANTHROPIC AI ASSISTANT ─────────────────────────────────────
const engine = new AIEngine();

async function askLIMEAI(question, conversationHistory) {
  const stats = engine.getSystemStats();
  const preds = Object.values(engine.predictions);
  const criticals = preds.filter(p=>p.riskLevel==='critical'||p.riskLevel==='stockout').slice(0,10);
  const evals = Object.values(engine.evaluations);

  const context = `You are LIME AI — the intelligent brain of Kenya's national vaccine monitoring system. You LEARN from data, MONITOR for anomalies, PREDICT stockouts and expiry risks, and EVALUATE hospital performance.

Current System State:
- Total doses in stock: ${stats.totalDoses.toLocaleString()}
- Critical stockout situations: ${stats.criticals}
- Batches expiring within 30 days: ${stats.expiringSoon}
- Anomalies detected: ${stats.anomalyCount}
- Doses administered (last 7 days): ${stats.totalAdmins7}
- Average hospital performance score: ${stats.avgScore}/100
- AI learning cycles completed: ${stats.learningCycles}
- Hospitals monitored: ${HOSPITALS.length} (Kenya)
- Vaccines tracked: ${VACCINES.length}

Critical Situations Right Now:
${criticals.map(p=>{
  const h=HOSPITALS.find(x=>x.id===p.hospitalId);
  const v=VACCINES.find(x=>x.id===p.vaccineId);
  return `- ${v?.name} at ${h?.name} (${h?.county}): ${p.riskLevel==='stockout'?'STOCKOUT':p.daysUntilStockout+' days left'}, trend: ${p.trend}`;
}).join('\n')}

Hospital Performance Grades:
${evals.map(e=>{
  const h=HOSPITALS.find(x=>x.id===e.hospitalId);
  return `- ${h?.name}: ${e.grade} (${e.overall}/100) — Stock coverage: ${e.stockCoverage}%`;
}).join('\n')}

Anomalies Detected:
${engine.anomalies.map(a=>{
  const h=HOSPITALS.find(x=>x.id===a.hospitalId);
  const v=VACCINES.find(x=>x.id===a.vaccineId);
  return `- ${a.type.toUpperCase()} at ${h?.name}: ${v?.name} — ${a.message}`;
}).join('\n')||'None detected currently.'}

You respond as an AI health intelligence system. Be specific, data-driven, and actionable. Mention actual numbers from the data above. Keep responses concise but insightful. You can make recommendations, flag risks, explain trends, and suggest actions for nurses, district officers, and ministry officials.`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1000,
      system:context,
      messages:conversationHistory.concat([{role:"user",content:question}])
    })
  });
  const data = await response.json();
  return data.content?.[0]?.text || "AI response unavailable.";
}

return { engine, HOSPITALS, VACCINES, stock, admins, askLIMEAI };
})();

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v]) => {
    if(k==='class') el.className=v;
    else if(k==='style') el.style.cssText=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c => {
    if(c===null||c===undefined) return;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  });
  return el;
}

function r(el,content) { el.innerHTML=''; if(content) el.appendChild(content); }
function badge(text, cls) { return h('span',{class:`badge ${cls}`},text); }
function getRiskBadge(risk,days) {
  if(risk==='stockout') return badge('STOCKOUT','b-out');
  if(risk==='critical') return badge(`⚡ ${days}d`,'b-crit');
  if(risk==='warning') return badge(`⚠ ${days}d`,'b-warn');
  return badge('✓ OK','b-ok');
}

//  LOGIN — Beautiful particle canvas background
// ─────────────────────────────────────────────────────────────
function renderLogin() {
  const wrap = document.createElement('div');
  wrap.className = 'login-wrap';

  // Particle canvas
  const canvas = document.createElement('canvas');
  canvas.className = 'login-canvas';
  wrap.appendChild(canvas);

  // Animate particles
  let raf;
  const particles = Array.from({length:80},()=>({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    vx: (Math.random()-.5)*.4,
    vy: (Math.random()-.5)*.4,
    r: Math.random()*2+.5,
    opacity: Math.random()*.6+.1,
    color: Math.random()>.6 ? '#b8ff40' : '#00dfc8'
  }));

  function drawParticles() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Draw connections
    particles.forEach((p,i) => {
      particles.slice(i+1).forEach(q => {
        const d = Math.hypot(p.x-q.x, p.y-q.y);
        if(d<120) {
          ctx.strokeStyle = `rgba(0,223,200,${0.06*(1-d/120)})`;
          ctx.lineWidth = .5;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
        }
      });
    });
    particles.forEach(p => {
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>canvas.width) p.vx*=-1;
      if(p.y<0||p.y>canvas.height) p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.color + Math.round(p.opacity*255).toString(16).padStart(2,'0');
      ctx.fill();
    });
    raf = requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // Login box
  const box = document.createElement('div');
  box.className = 'login-box';
  box.innerHTML = `
    <div style="text-align:center;margin-bottom:32px">
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(0,223,200,.1);border:1px solid rgba(0,223,200,.25);border-radius:20px;margin-bottom:16px">
        <div style="width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse-lime 2s infinite"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:1.5px">KENYA NATIONAL HEALTH SYSTEM</span>
      </div>
      <div style="font-size:56px;font-weight:800;color:var(--white);letter-spacing:-3px;line-height:1">
        L<span style="color:var(--lime)">I</span>ME <span style="color:var(--teal)">AI</span>
      </div>
      <div style="font-size:12px;color:var(--soft);letter-spacing:2px;text-transform:uppercase;margin-top:8px;font-family:var(--mono)">Vaccine Intelligence Platform</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">
        <span class="badge b-lime">Learn</span><span class="badge b-ok">Monitor</span><span class="badge b-warn">Predict</span><span class="badge b-purple">Evaluate</span>
      </div>
    </div>
    <div style="background:var(--panel);border:1px solid var(--rim2);border-radius:16px;padding:32px;backdrop-filter:blur(20px)">
      <div id="loginErr" style="display:none" class="error-box"></div>
      <div class="form-group"><label class="form-label">Username</label><input id="loginUser" class="form-input" placeholder="admin" value="admin"></div>
      <div class="form-group"><label class="form-label">Password</label><input id="loginPass" class="form-input" type="password" placeholder="••••••••" value="admin123"></div>
      <button id="loginBtn" class="btn btn-lime" style="width:100%;padding:14px;font-size:15px;justify-content:center">Access LIME AI →</button>
      <div style="text-align:center;margin-top:16px;font-family:var(--mono);font-size:10px;color:var(--soft);line-height:2">
        admin / admin123 · nurse_knh / nurse123 · district_officer / district123
      </div>
    </div>
    <div style="text-align:center;margin-top:20px;display:flex;gap:16px;justify-content:center">
      <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=60&h=60&fit=crop&crop=center" style="width:50px;height:50px;border-radius:50%;border:2px solid var(--rim2);object-fit:cover;opacity:.7">
      <img src="https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=60&h=60&fit=crop&crop=center" style="width:50px;height:50px;border-radius:50%;border:2px solid var(--rim2);object-fit:cover;opacity:.7">
      <img src="https://images.unsplash.com/photo-1504813184591-01572f98c85f?w=60&h=60&fit=crop&crop=center" style="width:50px;height:50px;border-radius:50%;border:2px solid var(--rim2);object-fit:cover;opacity:.7">
    </div>`;
  wrap.appendChild(box);

  document.getElementById('app').innerHTML='';
  document.getElementById('app').style.display='block';
  document.getElementById('app').appendChild(wrap);

  function doLogin(){
    const u=document.getElementById('loginUser').value.trim();
    const p=document.getElementById('loginPass').value;
    const err=document.getElementById('loginErr');
    if((u==='admin'&&p==='admin123')||(u==='nurse_knh'&&p==='nurse123')||(u==='district_officer'&&p==='district123')){
      cancelAnimationFrame(raf);
      currentUser={username:u,role:u==='admin'?'System Admin':u==='nurse_knh'?'Nurse — KNH':'District Officer',hospital:u==='nurse_knh'?1:null};
      document.getElementById('app').style.display='';
      renderApp();
    } else {
      err.textContent='Invalid credentials'; err.style.display='block';
    }
  }
  document.getElementById('loginBtn').onclick=doLogin;
  document.getElementById('loginPass').onkeydown=e=>{if(e.key==='Enter')doLogin();};
}

function renderAI(el) {
  el.style.cssText='padding:0;height:100%;display:flex;flex-direction:column';
  const chat=document.createElement('div');
  chat.className='ai-chat';
  const messages=document.createElement('div');
  messages.className='chat-messages';

  if(chatMessages.length===0){
    chatMessages.push({role:'ai',text:`👋 I'm **LIME AI** — Kenya's national vaccine intelligence brain.\n\nI've analysed **${LIME.admins.length.toLocaleString()} administration records** across **${LIME.HOSPITALS.length} hospitals**.\n\nCurrently: **${LIME.engine.getSystemStats().criticals} critical stockout risks**, **${LIME.engine.getSystemStats().anomalyCount} anomalies detected**.\n\nAsk me anything about stockouts, anomalies, predictions, hardware, or hospital performance.`});
  }

  function renderMessages(){
    messages.innerHTML='';
    chatMessages.forEach(m=>{
      const isAI=m.role==='ai';
      const msg=document.createElement('div');
      msg.className=`msg${isAI?'':' user'}`;
      const av=document.createElement('div');
      av.className=`msg-avatar ${isAI?'msg-ai':'msg-user-av'}`;
      av.textContent=isAI?'🧠':'👤';
      const bubble=document.createElement('div');
      bubble.className=`msg-bubble${isAI?'':' user-bubble'}`;
      bubble.innerHTML=m.text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
      msg.append(av,bubble);
      messages.appendChild(msg);
    });
    if(isTyping){
      const tm=document.createElement('div');
      tm.className='msg';
      tm.innerHTML=`<div class="msg-avatar msg-ai">🧠</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
      messages.appendChild(tm);
    }
    setTimeout(()=>messages.scrollTop=messages.scrollHeight,50);
  }

  const inputArea=document.createElement('div');
  inputArea.className='chat-input-area';
  const qRow=document.createElement('div');
  qRow.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px';
  ['Which hospitals are most at risk?','Explain the anomalies','What should Ministry do today?','Worst performing hospital','Predict outbreak signals'].forEach(q=>{
    const c=document.createElement('div');
    c.className='qa-chip';
    c.textContent=q;
    c.onclick=()=>sendMsg(q);
    qRow.appendChild(c);
  });
  const iRow=document.createElement('div');
  iRow.style.cssText='display:flex;gap:8px;align-items:flex-end';
  const textarea=document.createElement('textarea');
  textarea.className='chat-input';
  textarea.placeholder='Ask LIME AI anything...';
  textarea.rows=1;
  const sendBtn=document.createElement('button');
  sendBtn.className='btn btn-lime';
  sendBtn.textContent='↑';
  sendBtn.onclick=()=>sendMsg(textarea.value);
  textarea.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(textarea.value);}};
  iRow.append(textarea,sendBtn);
  inputArea.append(qRow,iRow);

  async function sendMsg(text){
    if(!text.trim()||isTyping) return;
    textarea.value='';
    chatMessages.push({role:'user',text});
    chatHistory.push({role:'user',content:text});
    isTyping=true; renderMessages();
    try{
      const reply=await LIME.askLIMEAI(text,chatHistory.slice(-10));
      chatMessages.push({role:'ai',text:reply});
      chatHistory.push({role:'assistant',content:reply});
    }catch(e){
      chatMessages.push({role:'ai',text:`⚠️ AI connection error. Offline insight: ${LIME.engine.getTopInsights()[0]?.body||'System monitoring active.'}`});
    }
    isTyping=false; renderMessages();
  }

  chat.append(messages,inputArea);
  el.appendChild(chat);
  renderMessages();
}

// ─────────────────────────────────────────────────────────────
function renderPredict(el) {
  const preds=Object.values(LIME.engine.predictions);
  let filt='all';
  function rebuild(){
    el.innerHTML='';
    el.innerHTML='<div class="section-hdr"><div class="section-title">🔮 AI Stockout Predictions</div><div class="section-sub">Machine-learned forecasts · trend + seasonality + expiry overlay</div></div>';
    const fRow=document.createElement('div');
    fRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px';
    ['all','stockout','critical','warning','ok'].forEach(f=>{
      const labels={all:'All',stockout:'🔴 Stockout',critical:'⚡ Critical',warning:'⚠ Warning',ok:'✓ Healthy'};
      const btn=document.createElement('button');
      btn.className=`btn btn-ghost btn-sm`;
      if(filt===f) btn.style.cssText='border-color:var(--lime);color:var(--lime)';
      btn.textContent=labels[f];
      btn.onclick=()=>{filt=f;rebuild();};
      fRow.appendChild(btn);
    });
    el.appendChild(fRow);
    const sg=document.createElement('div');
    sg.className='grid-4';
    ['stockout','critical','warning','ok'].forEach(r2=>{
      const n=preds.filter(p=>p.riskLevel===r2).length;
      const cols={stockout:'var(--red)',critical:'var(--amber)',warning:'var(--blue)',ok:'var(--lime)'};
      const c=document.createElement('div');
      c.className='stat-card';
      c.style.cursor='pointer';
      c.innerHTML=`<div class="stat-num" style="color:${cols[r2]};font-size:28px">${n}</div><div class="stat-label" style="text-transform:capitalize">${r2}</div>`;
      c.onclick=()=>{filt=r2;rebuild();};
      sg.appendChild(c);
    });
    el.appendChild(sg);
    const card=document.createElement('div');
    card.className='card';
    const tbl=document.createElement('table');
    tbl.innerHTML='<thead><tr><th>Hospital</th><th>Vaccine</th><th>Stock</th><th>Usage/day</th><th>Days Left</th><th>Trend</th><th>7-day Forecast</th><th>Risk</th></tr></thead>';
    const tbody=document.createElement('tbody');
    const shown=filt==='all'?preds:preds.filter(p=>p.riskLevel===filt);
    shown.sort((a,b)=>{
      const o={stockout:0,critical:1,warning:2,ok:3};
      return (o[a.riskLevel]||3)-(o[b.riskLevel]||3)||(a.daysUntilStockout||999)-(b.daysUntilStockout||999);
    }).slice(0,60).forEach(p=>{
      const hosp=LIME.HOSPITALS.find(x=>x.id===p.hospitalId);
      const vacc=LIME.VACCINES.find(x=>x.id===p.vaccineId);
      const tc=p.trend==='increasing'?'var(--red)':p.trend==='decreasing'?'var(--blue)':'var(--dim)';
      const ti=p.trend==='increasing'?'↑':p.trend==='decreasing'?'↓':'→';
      const spark=document.createElement('div');
      spark.className='sparkline';
      const mx=Math.max(...(p.forecast7||[1]),1);
      (p.forecast7||[]).forEach(v=>{
        const b=document.createElement('div');
        b.className='spark-bar';
        const pct=Math.max(5,Math.round((v/mx)*100));
        b.style.cssText=`height:${pct}%;background:${pct>70?'var(--amber)':'var(--teal)'}`;
        spark.appendChild(b);
      });
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td><div class="td-main" style="font-size:12px">${hosp?.name}</div><div class="td-sub">${hosp?.county}</div></td>
        <td>${vacc?.name||''}</td>
        <td><span style="font-family:var(--mono);font-weight:700;color:${p.currentStock===0?'var(--red)':p.currentStock<50?'var(--amber)':'var(--body)'}">${p.currentStock}</span></td>
        <td><span style="font-family:var(--mono);color:var(--dim)">${p.dailyRate}</span></td>
        <td><span style="font-family:var(--mono);font-weight:700;color:${p.daysUntilStockout<=7?'var(--red)':p.daysUntilStockout<=14?'var(--amber)':'var(--teal)'}">${p.daysUntilStockout===null?'∞':p.daysUntilStockout}</span></td>
        <td><span style="color:${tc};font-family:var(--mono);font-size:16px;font-weight:700">${ti}</span></td>`;
      const tdF=document.createElement('td');
      tdF.appendChild(spark);
      const tdR=document.createElement('td');
      tdR.appendChild(getRiskBadge(p.riskLevel,p.daysUntilStockout));
      tr.append(tdF,tdR);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    card.appendChild(Object.assign(document.createElement('div'),{className:'tbl-wrap'}));
    card.querySelector('.tbl-wrap').appendChild(tbl);
    el.appendChild(card);
  }
  rebuild();
}

function renderStock(el) {
  const today=new Date();
  const valid=LIME.stock.filter(s=>new Date(s.expiryDate)>today&&s.quantity>0);
  const exp=LIME.stock.filter(s=>{const d=Math.round((new Date(s.expiryDate)-today)/86400000);return d>0&&d<=30&&s.quantity>0;});
  const expired=LIME.stock.filter(s=>new Date(s.expiryDate)<=today&&s.quantity>0);
  el.innerHTML='<div class="section-hdr"><div class="section-title">💊 Stock Registry</div><div class="section-sub">'+LIME.stock.length+' batches across '+LIME.HOSPITALS.length+' hospitals</div></div>';
  const sg=document.createElement('div');
  sg.className='grid-3';
  [
    {label:'Valid Batches',val:valid.length,meta:valid.reduce((s,x)=>s+x.quantity,0).toLocaleString()+' doses',color:'var(--lime)'},
    {label:'Expiring ≤30 Days',val:exp.length,meta:exp.reduce((s,x)=>s+x.quantity,0)+' at risk',color:'var(--amber)'},
    {label:'Expired (uncleared)',val:expired.length,meta:'needs disposal',color:'var(--red)'},
  ].forEach(s=>{
    const c=document.createElement('div');
    c.className='stat-card';
    c.innerHTML=`<div class="stat-num" style="color:${s.color}">${s.val}</div><div class="stat-label">${s.label}</div><div class="stat-meta">${s.meta}</div>`;
    sg.appendChild(c);
  });
  el.appendChild(sg);
  const card=document.createElement('div');
  card.className='card';
  const tbl=document.createElement('table');
  tbl.innerHTML='<thead><tr><th>Hospital</th><th>Vaccine</th><th>Batch</th><th>Qty</th><th>Expiry</th><th>Days</th><th>Status</th></tr></thead>';
  const tbody=document.createElement('tbody');
  LIME.stock.slice(0,80).forEach(s=>{
    const hosp=LIME.HOSPITALS.find(x=>x.id===s.hospitalId);
    const vacc=LIME.VACCINES.find(x=>x.id===s.vaccineId);
    const days=Math.round((new Date(s.expiryDate)-today)/86400000);
    const st=days<=0?badge('EXPIRED','b-dim'):days<=14?badge('EXPIRING','b-crit'):days<=30?badge('WATCH','b-warn'):badge('OK','b-ok');
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><div class="td-main" style="font-size:12px">${hosp?.name}</div><div class="td-sub">${hosp?.county}</div></td>
      <td>${vacc?.name||''}</td>
      <td><span style="font-family:var(--mono);font-size:11px;color:var(--dim)">${s.batch}</span></td>
      <td><span style="font-family:var(--mono);font-weight:700;color:${s.quantity<20?'var(--red)':s.quantity<100?'var(--amber)':'var(--body)'}">${s.quantity}</span></td>
      <td><span style="font-family:var(--mono);font-size:11px">${s.expiryDate}</span></td>
      <td><span style="font-family:var(--mono);font-size:11px;color:${days<=0?'var(--red)':days<=14?'var(--amber)':'var(--dim)'}">${days}d</span></td>`;
    tr.appendChild(Object.assign(document.createElement('td'),{})).appendChild(st);
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  card.appendChild(Object.assign(document.createElement('div'),{className:'tbl-wrap'}));
  card.querySelector('.tbl-wrap').appendChild(tbl);
  el.appendChild(card);
}

function renderEvaluate(el) {
  const evals=Object.values(LIME.engine.evaluations).sort((a,b)=>b.overall-a.overall);
  el.innerHTML='<div class="section-hdr"><div class="section-title">📊 Hospital Evaluation</div><div class="section-sub">AI-powered scoring · 5 dimensions · updated every learning cycle</div></div>';
  evals.forEach(e=>{
    const hosp=LIME.HOSPITALS.find(x=>x.id===e.hospitalId);
    const gc=e.grade==='A'?'var(--lime)':e.grade==='B'?'var(--teal)':e.grade==='C'?'var(--amber)':'var(--red)';
    const mc=document.createElement('div');
    mc.className='model-card';
    const ring=document.createElement('div');
    ring.className='score-ring';
    const r2=28,circ=2*Math.PI*r2;
    ring.innerHTML=`<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r2}" fill="none" stroke="var(--rim)" stroke-width="4"/><circle cx="32" cy="32" r="${r2}" fill="none" stroke="${gc}" stroke-width="4" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-e.overall/100)}" stroke-linecap="round"/></svg><div class="score-num" style="color:${gc}">${e.overall}</div>`;
    const mh=document.createElement('div');
    mh.className='model-header';
    const info=document.createElement('div');
    info.style.flex='1';
    info.innerHTML=`<div class="model-name">${hosp?.name}</div><div class="model-type">${hosp?.county} · ${hosp?.level}</div><div style="margin-top:6px"><span style="font-size:26px;font-weight:800;font-family:var(--mono);color:${gc}">${e.grade}</span><span style="color:var(--soft);font-family:var(--mono);font-size:11px;margin-left:8px">Grade</span></div>`;
    mh.append(ring,info);
    mc.appendChild(mh);
    const mm=document.createElement('div');
    mm.className='model-metrics';
    [{l:'Stock Coverage',v:e.stockCoverage+'%'},{l:'Expiry Mgmt',v:e.expiryMgmt+'%'},{l:'Utilization',v:e.utilizationRate+'%'},{l:'Consistency',v:e.consistencyScore+'%'},{l:'Alert Score',v:e.alertScore+'%'}].forEach(m=>{
      const b=document.createElement('div');
      b.className='metric-box';
      b.innerHTML=`<div class="metric-val">${m.v}</div><div class="metric-label">${m.l}</div>`;
      mm.appendChild(b);
    });
    mc.appendChild(mm);
    el.appendChild(mc);
  });
}

function renderAdminister(el) {
  const hospitalId=currentUser.hospital||1;
  const hosp=LIME.HOSPITALS.find(x=>x.id===hospitalId);
  const today=new Date();
  const valid=LIME.stock.filter(s=>s.hospitalId===hospitalId&&new Date(s.expiryDate)>today&&s.quantity>0);
  el.innerHTML='<div class="section-hdr"><div class="section-title">💉 Administer Vaccine</div><div class="section-sub">Nurse logging · auto-syncs to AI engine · inventory updated live</div></div>';

  // Photo
  const ph=document.createElement('div');
  ph.className='unsplash-card mb-3';
  ph.style.height='140px';
  ph.innerHTML='<img src="https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=900&h=200&fit=crop" loading="lazy"><div class="unsplash-overlay"><div class="unsplash-title">'+hosp?.name+'</div><div class="unsplash-sub">'+hosp?.county+' · '+hosp?.level+'</div></div>';
  el.appendChild(ph);

  const form=document.createElement('div');
  form.className='card';
  form.style.maxWidth='560px';
  const fb=document.createElement('div');
  fb.className='card-body';
  const suc=document.createElement('div');
  suc.className='success-box'; suc.style.display='none';
  const err=document.createElement('div');
  err.className='error-box'; err.style.display='none';
  const patIn=document.createElement('input');
  patIn.className='form-input'; patIn.placeholder='e.g. PAT-12345';
  const ageIn=document.createElement('input');
  ageIn.className='form-input'; ageIn.type='number'; ageIn.placeholder='Age in months/years';
  const stockSel=document.createElement('select');
  stockSel.className='form-select';
  stockSel.innerHTML='<option value="">— Select vaccine batch —</option>';
  valid.forEach(s=>{
    const v=LIME.VACCINES.find(x=>x.id===s.vaccineId);
    const opt=document.createElement('option');
    opt.value=s.id;
    opt.textContent=`${v?.name} · ${s.batch} · ${s.quantity} doses · exp ${s.expiryDate}`;
    stockSel.appendChild(opt);
  });
  const doseSel=document.createElement('select');
  doseSel.className='form-select';
  [1,2,3,4,5].forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=`Dose ${n}`;doseSel.appendChild(o);});
  const btn=document.createElement('button');
  btn.className='btn btn-lime';
  btn.style.cssText='padding:13px 36px;width:100%;justify-content:center;font-size:14px';
  btn.textContent='💉 Record Administration';
  btn.onclick=()=>{
    if(!patIn.value.trim()||!stockSel.value){err.textContent='Patient ID and vaccine batch required.';err.style.display='block';return;}
    const si=LIME.stock.find(x=>x.id===parseInt(stockSel.value));
    if(si) si.quantity--;
    suc.textContent='✓ Administered. Stock updated. LIME AI will re-analyse on next cycle.';
    suc.style.display='block'; err.style.display='none';
    patIn.value=''; stockSel.selectedIndex=0;
    setTimeout(()=>LIME.engine.train(),500);
  };

  const ageStockRow=document.createElement('div');
  ageStockRow.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px';
  ageStockRow.innerHTML='<div></div><div></div>';
  ageStockRow.children[0].innerHTML='<label class="form-label">Patient Age</label>';
  ageStockRow.children[0].appendChild(ageIn);
  ageStockRow.children[1].innerHTML='<label class="form-label">Dose Number</label>';
  ageStockRow.children[1].appendChild(doseSel);

  fb.append(
    suc,err,
    Object.assign(document.createElement('div'),{className:'form-group',innerHTML:'<label class="form-label">Patient ID *</label>'}).appendChild(patIn)&&fb,
    Object.assign(document.createElement('div'),{className:'form-group',innerHTML:'<label class="form-label">Patient ID *</label>'}),
    ageStockRow,
    Object.assign(document.createElement('div'),{className:'form-group',innerHTML:'<label class="form-label">Vaccine Batch *</label>'}),
    btn
  );

  // Rebuild clean
  fb.innerHTML='';
  fb.append(suc,err);
  const pg=document.createElement('div');
  pg.className='form-group';
  pg.innerHTML='<label class="form-label">Patient ID *</label>';
  pg.appendChild(patIn);
  fb.appendChild(pg);
  fb.appendChild(ageStockRow);
  const vg=document.createElement('div');
  vg.className='form-group';
  vg.innerHTML='<label class="form-label">Vaccine Batch *</label>';
  vg.appendChild(stockSel);
  fb.appendChild(vg);
  fb.appendChild(btn);
  form.appendChild(fb);
  el.appendChild(form);
}

function renderLearn(el) {
  const engine=LIME.engine;
  const models=Object.entries(engine.models);
  el.innerHTML='<div class="section-hdr"><div class="section-title">📚 AI Learning Engine</div><div class="section-sub">Trained on '+LIME.admins.length.toLocaleString()+' records · '+engine.learningCycles+' learning cycles</div></div>';
  const retrain=document.createElement('button');
  retrain.className='btn btn-lime mb-3';
  retrain.textContent='🔄 Retrain AI Models';
  retrain.onclick=()=>{retrain.textContent='Training...';retrain.disabled=true;setTimeout(()=>{engine.train();retrain.textContent='🔄 Retrain AI Models';retrain.disabled=false;renderLearn(el);el.scrollTop=0;},1000);};
  el.appendChild(retrain);
  const allConf=models.map(([,m])=>m.confidence||0);
  const avgConf=Math.round(allConf.reduce((s,x)=>s+x,0)/allConf.length);
  const highConf=models.filter(([,m])=>m.confidence>=70).length;
  const allR2=models.filter(([,m])=>m.r2).map(([,m])=>m.r2);
  const avgR2=(allR2.reduce((s,x)=>s+x,0)/allR2.length).toFixed(2);
  const sg=document.createElement('div');
  sg.className='grid-4 mb-3';
  [{label:'Models Trained',val:models.length,color:'var(--lime)'},{label:'Avg Confidence',val:avgConf+'%',color:'var(--teal)'},{label:'High Confidence',val:highConf,color:'var(--teal)',meta:'≥70%'},{label:'Avg R²',val:avgR2,color:'var(--purple)'}].forEach(s=>{
    const c=document.createElement('div');
    c.className='stat-card';
    c.innerHTML=`<div class="stat-num" style="color:${s.color}">${s.val}</div><div class="stat-label">${s.label}</div><div class="stat-meta">${s.meta||''}</div>`;
    sg.appendChild(c);
  });
  el.appendChild(sg);
  const alg=document.createElement('div');
  alg.className='card mb-3';
  alg.innerHTML=`<div class="card-head"><div class="card-title">🧮 Algorithm Details</div></div><div class="card-body"><div class="grid-2" style="gap:16px">
    ${[
      {icon:'📈',name:'Usage Forecasting',type:'Weighted Moving Avg + Trend',desc:'60% recent (14d) + 40% historical · trend detection · day-of-week seasonality · confidence from variance'},
      {icon:'📡',name:'Anomaly Detection',type:'Statistical Z-score',desc:'7-day actual vs expected · spike >2.2x → outbreak signal · drop <0.25x → disruption'},
      {icon:'🔮',name:'Stockout Prediction',type:'Trend-adjusted depletion',desc:'Days = stock / projected_rate · 7-day demand forecast with seasonality · expiry overlay'},
      {icon:'📊',name:'Hospital Evaluation',type:'Multi-dimensional scoring',desc:'Stock 30% + Expiry 20% + Utilization 20% + Consistency 15% + Alerts 15% = Grade A–F'},
    ].map(m=>`<div class="model-card" style="margin:0"><div class="model-header"><div class="model-icon">${m.icon}</div><div><div class="model-name">${m.name}</div><div class="model-type">${m.type}</div></div></div><div style="font-size:12px;color:var(--dim);line-height:1.7">${m.desc}</div><div class="training-bar"><div class="training-fill"></div></div></div>`).join('')}
  </div></div>`;
  el.appendChild(alg);
  const road=document.createElement('div');
  road.className='card';
  road.innerHTML='<div class="card-head"><div class="card-title">🚀 AI Upgrade Roadmap</div></div><div class="card-body"><div style="font-size:12px;color:var(--dim);line-height:2.4"><div><span class="tag">Current</span>Weighted moving average + trend detection</div><div><span class="tag" style="color:var(--amber);border-color:var(--amber)">v3</span>Facebook Prophet — handles seasonality + holidays</div><div><span class="tag" style="color:var(--teal);border-color:var(--teal)">v4</span>LSTM neural network — complex temporal patterns</div><div><span class="tag" style="color:var(--purple);border-color:var(--purple)">v5</span>Multi-variate: outbreaks + population + weather</div><div><span class="tag" style="color:var(--lime);border-color:var(--lime)">v6</span>Federated learning — hospitals train without sharing raw data</div></div></div>';
  el.appendChild(road);
}

  mapBody.style.cssText='position:relative;height:480px';
  const mapCanvas=document.createElement('canvas');
  mapCanvas.style.cssText='width:100%;height:100%;display:block;cursor:crosshair';
  const tooltip=document.createElement('div');
  tooltip.style.cssText='position:absolute;background:var(--panel);border:1px solid var(--rim2);border-radius:10px;padding:12px 16px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)';
  mapBody.append(mapCanvas,tooltip);
  mapCard.appendChild(mapBody);
  el.appendChild(mapCard);

  // Kenya geo bounds
  const GEO={latMin:-4.9,latMax:5.1,lngMin:33.8,lngMax:42.0};
  function geo(lat,lng,w,h){
    return [((lng-GEO.lngMin)/(GEO.lngMax-GEO.lngMin))*w,(1-(lat-GEO.latMin)/(GEO.latMax-GEO.latMin))*h];
  }

  // Kenya simplified border
  const KB=[[5.0,34.0],[4.6,34.2],[4.2,34.3],[3.8,34.5],[3.5,35.0],[3.2,35.5],[2.9,36.0],[2.5,36.2],[1.9,37.0],[1.2,38.0],[0.5,39.0],[0.0,40.0],[-0.5,41.0],[-1.0,41.5],[-1.7,40.8],[-2.5,40.2],[-3.5,39.8],[-4.5,39.4],[-4.7,38.5],[-4.2,37.5],[-3.8,36.5],[-3.2,35.5],[-2.5,34.5],[-1.5,34.0],[-0.5,34.0],[0.5,33.9],[1.5,34.0],[2.5,34.0],[3.5,34.0],[4.3,34.0],[5.0,34.0]];

  // LIME cloud server at top
  const SERVER={lat:7.5,lng:37.9,name:'LIME AI Server',sub:'Nairobi Cloud · AWS AF-South'};

  let packets3=[];
  let mapAnim3;

  function drawMap3(){
    const w=mapCanvas.offsetWidth||900,h=480;
    mapCanvas.width=w; mapCanvas.height=h;
    const ctx=mapCanvas.getContext('2d');
    ctx.clearRect(0,0,w,h);

    // Deep space bg
    ctx.fillStyle='#050d18'; ctx.fillRect(0,0,w,h);
    // Grid
    ctx.strokeStyle='rgba(19,32,72,.5)'; ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

    // Kenya filled
    ctx.fillStyle='rgba(0,223,200,.04)'; ctx.strokeStyle='rgba(0,223,200,.3)'; ctx.lineWidth=2;
    ctx.beginPath();
    KB.forEach(([lat,lng],i)=>{ const [x,y]=geo(lat,lng,w,h); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Server glow
    const [sx,sy]=geo(SERVER.lat,SERVER.lng,w,h);
    const sg2=ctx.createRadialGradient(sx,sy,0,sx,sy,80);
    sg2.addColorStop(0,'rgba(184,255,64,0.12)'); sg2.addColorStop(1,'transparent');
    ctx.fillStyle=sg2; ctx.beginPath(); ctx.arc(sx,sy,80,0,Math.PI*2); ctx.fill();

    // Server → gateway lines
    HW.GATEWAYS.forEach(gw=>{
      const [gx,gy]=geo(gw.lat,gw.lng,w,h);
      ctx.strokeStyle=gw.online?'rgba(0,223,200,.18)':'rgba(255,74,74,.15)';
      ctx.lineWidth=1; ctx.setLineDash([5,8]);
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(gx,gy); ctx.stroke();
      ctx.setLineDash([]);
    });

    // Device → gateway lines
    [...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const gw=HW.GATEWAYS.find(g=>g.county===dev.county)||HW.GATEWAYS[0];
      const [dx,dy]=geo(dev.lat,dev.lng,w,h);
      const [gx,gy]=geo(gw.lat,gw.lng,w,h);
      ctx.strokeStyle=!dev.online?'rgba(255,74,74,.25)':dev.id.startsWith('BU')?'rgba(0,223,200,.22)':'rgba(77,166,255,.2)';
      ctx.lineWidth=.8; ctx.setLineDash([2,5]);
      ctx.beginPath(); ctx.moveTo(dx,dy); ctx.lineTo(gx,gy); ctx.stroke();
      ctx.setLineDash([]);
    });

    // Gateway coverage rings
    HW.GATEWAYS.forEach(gw=>{
      const [gx,gy]=geo(gw.lat,gw.lng,w,h);
      const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,85);
      const col=gw.online?'rgba(0,223,200,':'rgba(255,74,74,';
      rg.addColorStop(0,col+'0.08)'); rg.addColorStop(1,col+'0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(gx,gy,85,0,Math.PI*2); ctx.fill();
    });

    // Gateways
    HW.GATEWAYS.forEach(gw=>{
      const [gx,gy]=geo(gw.lat,gw.lng,w,h);
      const online=gw.online;
      // Pulse ring
      if(online){
        ctx.strokeStyle='rgba(0,223,200,.25)'; ctx.lineWidth=1;
        const pr=16+Math.sin(Date.now()/600)*3;
        ctx.beginPath(); ctx.arc(gx,gy,pr,0,Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle=online?'rgba(0,223,200,.2)':'rgba(255,74,74,.2)';
      ctx.strokeStyle=online?'var(--teal)':'var(--red)';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(gx,gy,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
      if(!online){ctx.fillStyle='var(--red)';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('×',gx,gy+5);}
      else{ctx.fillStyle='var(--teal)';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('◉',gx,gy+3);}
      ctx.fillStyle=online?'rgba(200,230,255,.6)':'rgba(255,150,150,.6)';
      ctx.font='7px monospace'; ctx.textAlign='center';
      ctx.fillText(gw.county.slice(0,7),gx,gy+23);
    });

    // BioUnits + VacciBoxes
    [...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const isBio=dev.id.startsWith('BU');
      const [dx,dy]=geo(dev.lat,dev.lng,w,h);
      const online=dev.online;
      const col=!online?'var(--red)':isBio?'var(--teal)':'var(--blue)';
      ctx.shadowBlur=online?8:0; ctx.shadowColor=col;
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(dx,dy,isBio?6:5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      if(!online){
        ctx.strokeStyle='rgba(255,74,74,.5)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(dx,dy,9,0,Math.PI*2); ctx.stroke();
      }
    });

    // LIME Server node
    ctx.fillStyle='rgba(184,255,64,.15)'; ctx.strokeStyle='var(--lime)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(sx,sy,18,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='var(--lime)'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText('☁',sx,sy+5);
    ctx.font='bold 8px monospace'; ctx.fillStyle='rgba(184,255,64,.8)';
    ctx.fillText('LIME SERVER',sx,sy+28);

    // Animate packets
    packets3.forEach(p=>{
      ctx.fillStyle=p.type==='server'?'var(--lime)':p.type==='bio'?'var(--teal)':'var(--blue)';
      ctx.shadowBlur=10; ctx.shadowColor=ctx.fillStyle;
      ctx.beginPath(); ctx.arc(p.cx,p.cy,3,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  function spawnPkt(){
    const all=[...HW.BIOUNITS,...HW.VACCIBOXES].filter(d=>d.online);
    if(!all.length)return;
    const dev=all[Math.floor(Math.random()*all.length)];
    const gw=HW.GATEWAYS.find(g=>g.county===dev.county)||HW.GATEWAYS[0];
    if(!gw.online)return;
    const w=mapCanvas.offsetWidth||900,h=480;
    const [dx,dy]=geo(dev.lat,dev.lng,w,h);
    const [gx,gy]=geo(gw.lat,gw.lng,w,h);
    const [sx,sy]=geo(SERVER.lat,SERVER.lng,w,h);
    packets3.push({sx:dx,sy:dy,mx:gx,my:gy,ex:sx,ey:sy,cx:dx,cy:dy,t:0,phase:'toGW',type:dev.id.startsWith('BU')?'bio':'box'});
  }

  function animMap(){
    packets3.forEach(p=>{
      p.t+=0.028;
      if(p.phase==='toGW'&&p.t>=1){p.phase='toServer';p.t=0;}
      if(p.phase==='toServer'&&p.t>=1){p.done=true;}
      const e=t=>{return t<.5?2*t*t:-1+(4-2*t)*t;};
      if(p.phase==='toGW'){p.cx=p.sx+(p.mx-p.sx)*e(p.t);p.cy=p.sy+(p.my-p.sy)*e(p.t);}
      else{p.cx=p.mx+(p.ex-p.mx)*e(p.t);p.cy=p.my+(p.ey-p.my)*e(p.t);}
    });
    packets3=packets3.filter(p=>!p.done);
    drawMap3();
    mapAnim3=requestAnimationFrame(animMap);
  }

  // Tooltip + click
  mapCanvas.onmousemove=e=>{
    const rect=mapCanvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(mapCanvas.width/rect.width);
    const my=(e.clientY-rect.top)*(mapCanvas.height/rect.height);
    const w=mapCanvas.width,h=mapCanvas.height;
    let hit=null;
    [...HW.GATEWAYS,...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const [dx,dy]=geo(dev.lat,dev.lng,w,h);
      if(Math.hypot(mx-dx,my-dy)<18)hit=dev;
    });
    if(hit){
      tooltip.style.display='block';
      tooltip.style.left=Math.min(e.offsetX+16, mapCanvas.offsetWidth-240)+'px';
      tooltip.style.top=Math.max(e.offsetY-60,10)+'px';
      const off=!hit.online;
      const typ=hit.id.startsWith('GW')?'Gateway':hit.id.startsWith('BU')?'BioUnit':'VacciBox';
      tooltip.innerHTML=`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="width:8px;height:8px;border-radius:50%;background:${off?'var(--red)':'var(--lime)'}"></div>
          <div style="font-weight:700;color:var(--bright)">${hit.name}</div>
        </div>
        <div style="font-family:var(--mono);font-size:10px;color:${off?'var(--red)':'var(--teal)'}">● ${off?'OFFLINE':'ONLINE'} · ${typ}</div>
        <div style="font-size:11px;color:var(--soft);margin-top:6px">${hit.county}${hit.hospital?(' · '+hit.hospital):''}</div>
        ${off?`<div style="font-size:11px;color:var(--amber);margin-top:4px">Last seen: ${HW.fmtAgo(hit.lastSeen)}</div><div style="font-size:10px;color:var(--mute);margin-top:3px">${(hit.offlineReason||'').slice(0,70)}...</div>`:`<div style="font-size:11px;color:var(--soft);margin-top:4px">Signal: ${hit.signal||'--'} dBm</div>`}
        <div style="font-size:10px;color:var(--teal);margin-top:8px;font-family:var(--mono)">Click for full details →</div>`;
      mapCanvas.style.cursor='pointer';
    } else {
      tooltip.style.display='none';
      mapCanvas.style.cursor='crosshair';
    }
  };
  mapCanvas.onmouseleave=()=>{tooltip.style.display='none';};
  mapCanvas.onclick=e=>{
    const rect=mapCanvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(mapCanvas.width/rect.width);
    const my=(e.clientY-rect.top)*(mapCanvas.height/rect.height);
    const w=mapCanvas.width,h=mapCanvas.height;
    [...HW.GATEWAYS,...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const [dx,dy]=geo(dev.lat,dev.lng,w,h);
      if(Math.hypot(mx-dx,my-dy)<18){
        const t=dev.id.startsWith('GW')?'gw':dev.id.startsWith('BU')?'bio':'box';
        document.body.appendChild(makeDevicePanel(dev,t));
      }
    });
  };

  const spawnI=setInterval(spawnPkt,400);
  animMap();

  // Device table below
  el.appendChild(document.createElement('div')).style.marginBottom='20px';
  const devGrid=document.createElement('div');
  devGrid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px';
  [{title:'🛡 Gateways',devs:HW.GATEWAYS,type:'gw'},{title:'🫀 BioUnits',devs:HW.BIOUNITS,type:'bio'},{title:'📦 VacciBoxes',devs:HW.VACCIBOXES,type:'box'}].forEach(grp=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`<div class="card-head"><div class="card-title">${grp.title}</div></div>`;
    const list=document.createElement('div');
    grp.devs.forEach(dev=>{
      const row=document.createElement('div');
      const off=!dev.online;
      row.style.cssText='display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(30,50,72,.5);cursor:pointer;transition:background .15s';
      row.innerHTML=`<div style="width:8px;height:8px;border-radius:50%;background:${off?'var(--red)':'var(--lime)'};flex-shrink:0;${off?'':'animation:pulse-lime 2s infinite'}"></div>
        <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;color:var(--bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dev.name}</div><div style="font-size:10px;color:var(--soft)">${dev.county}</div></div>
        ${off?`<span style="font-family:var(--mono);font-size:9px;color:var(--red);padding:1px 7px;background:rgba(255,74,74,.1);border-radius:5px">OFFLINE</span>`:`<span style="font-family:var(--mono);font-size:9px;color:var(--lime);padding:1px 7px;background:rgba(184,255,64,.08);border-radius:5px">LIVE</span>`}`;
      row.onmouseenter=()=>row.style.background='rgba(255,255,255,.03)';
      row.onmouseleave=()=>row.style.background='transparent';
      row.onclick=()=>document.body.appendChild(makeDevicePanel(dev,grp.type));
      list.appendChild(row);
    });
    c.appendChild(list);
    devGrid.appendChild(c);
  });
  el.appendChild(devGrid);

  el._cleanup=()=>{cancelAnimationFrame(mapAnim3);clearInterval(spawnI);};
}

const HW = (() => {
  const ago = (mins) => new Date(Date.now() - mins*60000);
  const fmtTime = (d) => d ? d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}) : '--:--';
  const fmtAgo = (d) => {
    if(!d) return 'Never';
    const m = Math.round((Date.now()-d.getTime())/60000);
    if(m<1) return 'Just now';
    if(m<60) return `${m}m ago`;
    const hrs = Math.floor(m/60);
    if(hrs<24) return `${hrs}h ${m%60}m ago`;
    return `${Math.floor(hrs/24)}d ${hrs%24}h ago`;
  };

  const BIOUNITS = [
    {id:'BU-001',name:'BioUnit Alpha',hospital:'Kenyatta National Hospital',county:'Nairobi',
     lat:-1.300,lng:36.806,online:true,battery:87,firmware:'v2.1.4',lastSeen:ago(0.5),
     scans:1284,signal:-68,
     vitals:{hr:74,spo2:98,temp:36.5,sbp:119,dbp:77,rr:16}},
    {id:'BU-002',name:'BioUnit Beta',hospital:'Kisumu County Hospital',county:'Kisumu',
     lat:-0.091,lng:34.768,online:true,battery:62,firmware:'v2.1.4',lastSeen:ago(2),
