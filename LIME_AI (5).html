// ── SHARED: Device detail panel ────────────────────────────────
function makeDevicePanel(device, type) {
  const {fmtTime, fmtAgo} = HW;
  const isOffline = !device.online;
  const panel = document.createElement('div');
  panel.style.cssText='position:fixed;inset:0;background:rgba(2,6,10,0.85);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)';

  const box = document.createElement('div');
  box.style.cssText='background:var(--surface);border:1px solid '+(isOffline?'var(--red)':'var(--border2)')+';border-radius:14px;width:580px;max-height:88vh;overflow-y:auto;position:relative';

  // Header
  const hdr = document.createElement('div');
  hdr.style.cssText='padding:24px 28px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1';
  hdr.innerHTML=`
    <div style="display:flex;align-items:flex-start;gap:14px">
      <div style="width:48px;height:48px;border-radius:12px;background:${isOffline?'rgba(255,61,61,0.12)':'rgba(0,229,204,0.1)'};border:1px solid ${isOffline?'rgba(255,61,61,0.3)':'rgba(0,229,204,0.25)'};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">
        ${type==='bio'?'🫀':type==='box'?'📦':'📡'}
      </div>
      <div style="flex:1">
        <div style="font-size:18px;font-weight:700;color:var(--bright)">${device.name}</div>
        <div style="font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px">${device.id} · ${device.hospital}</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <span style="padding:3px 10px;border-radius:10px;font-family:var(--mono);font-size:10px;font-weight:700;${isOffline?'background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)':'background:rgba(0,229,204,0.1);color:var(--cyan);border:1px solid rgba(0,229,204,0.2)'}">
            ${isOffline?'● OFFLINE':'● ONLINE'}
          </span>
          <span style="padding:3px 10px;border-radius:10px;font-family:var(--mono);font-size:10px;background:var(--raised);color:var(--dim);border:1px solid var(--border2)">${device.county}</span>
          ${device.firmware?`<span style="padding:3px 10px;border-radius:10px;font-family:var(--mono);font-size:10px;background:var(--raised);color:var(--dim);border:1px solid var(--border2)">${device.firmware}</span>`:''}
        </div>
      </div>
      <button onclick="this.closest('[style*=fixed]').remove()" style="background:var(--raised);border:1px solid var(--border2);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0">✕</button>
    </div>`;

  const body = document.createElement('div');
  body.style.cssText='padding:24px 28px';

  // Last seen
  body.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
      <div style="background:var(--raised);border-radius:8px;padding:14px;border:1px solid var(--border2)">
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:6px">LAST CONNECTED</div>
        <div style="font-size:15px;font-weight:700;color:${isOffline?'var(--red)':'var(--lime)'}">${fmtAgo(device.lastSeen)}</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px">${device.lastSeen?device.lastSeen.toLocaleString('en-KE'):'Unknown'}</div>
      </div>
      <div style="background:var(--raised);border-radius:8px;padding:14px;border:1px solid var(--border2)">
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:6px">BATTERY</div>
        <div style="font-size:15px;font-weight:700;color:${device.battery===0?'var(--red)':device.battery<30?'var(--amber)':'var(--lime)'}">${device.battery}%</div>
        <div style="height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden"><div style="height:100%;width:${device.battery}%;background:${device.battery<30?'var(--red)':'var(--lime)'};border-radius:2px"></div></div>
      </div>
    </div>`;

  // Offline reason
  if(isOffline && device.offlineReason) {
    body.innerHTML+=`
      <div style="background:rgba(255,61,61,0.07);border:1px solid rgba(255,61,61,0.2);border-radius:8px;padding:14px;margin-bottom:20px">
        <div style="font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:1.5px;margin-bottom:6px">⚠ OFFLINE REASON</div>
        <div style="font-size:13px;color:var(--text);line-height:1.6">${device.offlineReason}</div>
      </div>`;
  }

  // Last known packet
  if(isOffline && device.lastPacket) {
    const p = device.lastPacket;
    body.innerHTML+=`
      <div style="margin-bottom:20px">
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:10px">LAST KNOWN READINGS</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${Object.entries(p).map(([k,v])=>`
            <div style="background:var(--raised);border:1px solid var(--border2);border-radius:7px;padding:10px 14px;text-align:center">
              <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--amber)">${v}${k==='temp'?'°C':k==='bat'?'%':k==='hr'?' BPM':k==='spo2'?'%':''}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px">${k.toUpperCase()}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  // Connection log
  if(device.connectionLog) {
    body.innerHTML+=`<div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:10px">CONNECTION LOG</div>`;
    const log = document.createElement('div');
    log.style.cssText='display:flex;flex-direction:column;gap:0;position:relative;padding-left:20px';
    log.innerHTML+='<div style="position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border2);border-radius:1px"></div>';
    device.connectionLog.forEach(entry => {
      const colors = {error:'var(--red)',warn:'var(--amber)',info:'var(--cyan)'};
      const col = colors[entry.status]||'var(--muted)';
      log.innerHTML+=`
        <div style="display:flex;gap:12px;padding:8px 0;align-items:flex-start;position:relative">
          <div style="position:absolute;left:-14px;top:13px;width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></div>
          <div style="flex:1">
            <div style="font-size:12px;color:var(--text)">${entry.event}</div>
            <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px">${HW.fmtAgo(entry.time)} · ${entry.time.toLocaleTimeString('en-KE')}</div>
          </div>
        </div>`;
    });
    body.appendChild(log);
  }

  // Action buttons
  const acts = document.createElement('div');
  acts.style.cssText='display:flex;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)';
  acts.innerHTML=`
    <button onclick="alert('Reconnect command sent to ${device.id}')" style="flex:1;padding:10px;background:rgba(170,255,46,0.1);border:1px solid rgba(170,255,46,0.25);color:var(--lime);border-radius:7px;cursor:pointer;font-weight:600;font-size:13px">↻ Force Reconnect</button>
    <button onclick="alert('Alert sent to district officer for ${device.county}')" style="flex:1;padding:10px;background:rgba(255,176,32,0.1);border:1px solid rgba(255,176,32,0.25);color:var(--amber);border-radius:7px;cursor:pointer;font-weight:600;font-size:13px">📢 Alert District</button>
    <button onclick="this.closest('[style*=fixed]').remove()" style="padding:10px 18px;background:var(--raised);border:1px solid var(--border2);color:var(--muted);border-radius:7px;cursor:pointer;font-size:13px">Close</button>`;
  body.appendChild(acts);

  box.append(hdr, body);
  panel.appendChild(box);
  panel.addEventListener('click', e => { if(e.target===panel) panel.remove(); });
  return panel;
}

function renderBioUnit(el) {
  el.innerHTML='';
  let selectedUnit = HW.BIOUNITS[0];
  let scanActive = false;
  let ecgTimer, vitalTimer, scanTimer;
  let ecgPhase = 0;
  let liveVitals = {...(selectedUnit.vitals||{hr:72,spo2:98,temp:36.6,sbp:118,dbp:76,rr:16})};

  // ── Offline notification banner ──
  const offlineUnits = HW.BIOUNITS.filter(u=>!u.online);
  if(offlineUnits.length) {
    const banner = document.createElement('div');
    banner.style.cssText='display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,61,61,0.08);border:1px solid rgba(255,61,61,0.25);border-radius:10px;margin-bottom:20px;cursor:pointer;transition:all .2s';
    banner.innerHTML=`
      <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,61,61,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;animation:critpulse 1.5s ease-in-out infinite">🔴</div>
      <div style="flex:1">
        <div style="font-weight:700;color:var(--red);font-size:14px">${offlineUnits.length} BioUnit${offlineUnits.length>1?'s':''} Offline</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${offlineUnits.map(u=>`${u.name} (${u.county})`).join(' · ')} — click to view details</div>
      </div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--red)">VIEW →</div>`;
    banner.onclick = () => document.body.appendChild(makeDevicePanel(offlineUnits[0],'bio'));
    banner.onmouseenter=()=>banner.style.background='rgba(255,61,61,0.12)';
    banner.onmouseleave=()=>banner.style.background='rgba(255,61,61,0.08)';
    el.appendChild(banner);
  }

  // ── Device cards row ──
  const unitCards = document.createElement('div');
  unitCards.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px';
  HW.BIOUNITS.forEach(unit => {
    const card = document.createElement('div');
    const isOff = !unit.online;
    card.style.cssText=`background:var(--surface);border:1px solid ${selectedUnit.id===unit.id?(isOff?'var(--red)':'var(--cyan)'):'var(--border)'};border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden`;
    card.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:10px;height:10px;border-radius:50%;background:${isOff?'var(--red)':'var(--lime)'};${isOff?'':'animation:glow 2s infinite'}"></div>
        <div style="font-size:13px;font-weight:700;color:var(--bright);flex:1">${unit.name}</div>
        ${isOff?`<span style="font-family:var(--mono);font-size:9px;color:var(--red);padding:2px 7px;background:rgba(255,61,61,0.12);border-radius:8px;border:1px solid rgba(255,61,61,0.25)">OFFLINE</span>`:`<span style="font-family:var(--mono);font-size:9px;color:var(--cyan);padding:2px 7px;background:rgba(0,229,204,0.08);border-radius:8px">LIVE</span>`}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${unit.hospital}</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;background:var(--raised);border-radius:5px;padding:7px;text-align:center">
          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:${isOff?'var(--muted)':'var(--cyan)'}">${isOff?'--':unit.vitals.hr}</div>
          <div style="font-size:9px;color:var(--muted)">BPM</div>
        </div>
        <div style="flex:1;background:var(--raised);border-radius:5px;padding:7px;text-align:center">
          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:${isOff?'var(--muted)':'var(--lime)'}">${isOff?'--':unit.battery+'%'}</div>
          <div style="font-size:9px;color:var(--muted)">BATT</div>
        </div>
        <div style="flex:1;background:var(--raised);border-radius:5px;padding:7px;text-align:center">
          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:${isOff?'var(--red)':'var(--dim)'}">${isOff?HW.fmtAgo(unit.lastSeen):'Live'}</div>
          <div style="font-size:9px;color:var(--muted)">${isOff?'LAST SEEN':'STATUS'}</div>
        </div>
      </div>`;
    card.onclick = () => {
      if(isOff) { document.body.appendChild(makeDevicePanel(unit,'bio')); return; }
      selectedUnit = unit;
      liveVitals = {...unit.vitals};
      renderBioUnit(el);
    };
    card.onmouseenter=()=>{ if(selectedUnit.id!==unit.id) card.style.borderColor='var(--border2)'; };
    card.onmouseleave=()=>{ if(selectedUnit.id!==unit.id) card.style.borderColor='var(--border)'; };
    unitCards.appendChild(card);
  });
  el.appendChild(unitCards);

  // ── Main scanner interface ──
  const scanner = document.createElement('div');
  scanner.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px';

  // Left: vitals display
  const leftPanel = document.createElement('div');
  leftPanel.style.cssText='background:var(--surface);border:1px solid var(--border2);border-radius:12px;overflow:hidden';

  // Device header
  leftPanel.innerHTML=`

  // ── Vitals renderer ──
  function renderVitals() {

    const defs = [

      {key:'spo2',icon:'🫁',label:'SpO₂',unit:'%',ok:[95,100]},

      {key:'sbp',icon:'🩺',label:'Systolic',unit:'mmHg',ok:[90,130]},
      {key:'dbp',icon:'💊',label:'Diastolic',unit:'mmHg',ok:[60,85]},
      {key:'rr',icon:'🫀',label:'Resp Rate',unit:'/min',ok:[12,20]},
    ];
    grid.innerHTML='';
    defs.forEach(d => {
      const v = liveVitals[d.key]||0;
      const isOk = v>=d.ok[0]&&v<=d.ok[1];
      const col = isOk?'var(--cyan)':Math.abs(v-((d.ok[0]+d.ok[1])/2))>(d.ok[1]-d.ok[0])*0.8?'var(--red)':'var(--amber)';

    });

  // ── ECG ──
  let ecgPoints = Array(120).fill(28);
  function drawECG() {
    const canvas = document.getElementById('ecgCanvas');
    if(!canvas) return;
    const wrap = canvas.parentElement;
    canvas.width = wrap.offsetWidth||600;
    canvas.height = wrap.offsetHeight||56;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Grid lines
    ctx.strokeStyle='rgba(170,255,46,0.05)'; ctx.lineWidth=1;
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    for(let y=0;y<canvas.height;y+=14){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
    // ECG line
    ctx.strokeStyle='var(--lime)'; ctx.lineWidth=1.5;
    ctx.shadowBlur=4; ctx.shadowColor='var(--lime)';
    ctx.beginPath();
    const step=canvas.width/ecgPoints.length;
    ecgPoints.forEach((p,i)=>i===0?ctx.moveTo(0,p):ctx.lineTo(i*step,p));
    ctx.stroke(); ctx.shadowBlur=0;
  }
  function tickECG() {
    ecgPhase=(ecgPhase+1)%75;
    let y=28;
    if(ecgPhase===10)y=22;
    else if(ecgPhase===15)y=6;
    else if(ecgPhase===16)y=44;
    else if(ecgPhase===17)y=12;
    else if(ecgPhase===18)y=28;
    else if(ecgPhase>=22&&ecgPhase<=28)y=24-(ecgPhase-22)*1.2;
    else y=28+(Math.random()-0.5)*2;
    ecgPoints.push(y); ecgPoints.shift();
    drawECG();
  }
  ecgTimer=setInterval(tickECG,70);

          sbp:Math.round(108+Math.random()*30),
          dbp:Math.round(68+Math.random()*20),
          rr:Math.round(13+Math.random()*8)
        };
        renderVitals();
        const issues=[];
        if(liveVitals.hr<60||liveVitals.hr>100) issues.push(`Heart rate ${liveVitals.hr} BPM is abnormal`);
        if(liveVitals.temp>37.5) issues.push(`Fever: ${liveVitals.temp}°C detected`);
        if(liveVitals.spo2<95) issues.push(`Low SpO₂: ${liveVitals.spo2}%`);
        const txt=document.getElementById('aiAssessText');
        if(txt) txt.innerHTML = issues.length===0
          ? `<span style="color:var(--lime)">✓ All vitals normal.</span> Patient cleared for vaccination. Best injection site: <strong>Median Antecubital vein</strong>. Result transmitted via LOWANONE.`
          : `<span style="color:var(--amber)">⚠ ${issues.length} flag(s):</span><br>${issues.map(i=>`• ${i}`).join('<br>')}<br><span style="color:var(--muted);font-size:11px">Consult clinical staff before proceeding.</span>`;
      }
    },50);
  };

  vitalTimer=setInterval(()=>{
    if(scanActive) return;
    const j=(v,r)=>+(v+(Math.random()-0.5)*r).toFixed(1);
    liveVitals.hr=Math.round(j(liveVitals.hr,2));
    liveVitals.spo2=Math.min(100,j(liveVitals.spo2,0.4));
    renderVitals();
  },1800);

  el._cleanup=()=>{ clearInterval(ecgTimer); clearInterval(vitalTimer); clearInterval(scanTimer); };
  setTimeout(drawECG,100);
}

  [
    {icon:'❄️',color:'var(--cyan)',title:'Cold Chain Storage',sub:'2–8°C maintained',desc:'Peltier module + 4-zone temp sensing. Logs every 60s to LIME via LOWANONE. Breach alarm in <2s.',active:selectedBox.mode==='storage'},
    {icon:'🎒',color:'var(--blue)',title:'Portable Carrier',sub:'72hr battery, GPS tracked',desc:'Insulated foam + phase-change material when off dock. GPS tracked over LoRa. Auto-handoff to nearest gateway.',active:selectedBox.mode==='portable'},
    {icon:'💊',color:'var(--lime)',title:'Auto-Dispenser',sub:'Nurse scan → motor release',desc:'Patient ID from BioUnit → LIME selects batch → servo releases slot. Audit trail fully logged.',active:false},
  ].forEach(m=>{
    const c=document.createElement('div');
    c.style.cssText=`background:var(--surface);border:1px solid ${m.active?m.color+'50':'var(--border)'};border-radius:10px;padding:18px;position:relative;overflow:hidden`;
    if(m.active) c.innerHTML+=`<div style="position:absolute;top:0;left:0;right:0;height:2px;background:${m.color}"></div>`;
    c.innerHTML+=`
      <div style="font-size:28px;margin-bottom:10px">${m.icon}</div>
      <div style="font-size:14px;font-weight:700;color:var(--bright);margin-bottom:3px">${m.title}</div>
      <div style="font-size:11px;color:${m.color};margin-bottom:8px;font-family:var(--mono)">${m.sub}</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.6">${m.desc}</div>
      ${m.active?`<div style="margin-top:10px;font-family:var(--mono);font-size:10px;color:${m.color}">● ACTIVE</div>`:''}`;
    modesRow.appendChild(c);
  });
  el.appendChild(modesRow);

  // Live temp update
  let liveTemp = selectedBox.temp;
  tempTimer=setInterval(()=>{
    liveTemp=+(liveTemp+(Math.random()-0.49)*0.12).toFixed(1);
    liveTemp=Math.max(1.8,Math.min(8.5,liveTemp));
    const el2=document.getElementById('liveTemp');
    const ts=document.getElementById('tempStatus');
    if(el2) el2.textContent=liveTemp+'°C';
    const ok=liveTemp>=2&&liveTemp<=8;
    if(el2) el2.style.color=ok?'var(--cyan)':'var(--red)';
    if(ts){ ts.textContent=ok?'✓ Within WHO cold chain range (2–8°C)':'⚠ Temperature breach!'; ts.style.color=ok?'var(--cyan)':'var(--red)'; }
  },2000);
  el._cleanup=()=>clearInterval(tempTimer);
}

// ── LOWANONE NETWORK PAGE ──────────────────────────────────────
function renderLOWANONE(el) {
  el.innerHTML='';
  let mapAnim, spawnInt;
  let selectedDevice = null;

  // ── Offline notification banners ──
  const offlineGWs = HW.GATEWAYS.filter(g=>!g.online);
  const allOffline = [...HW.BIOUNITS.filter(u=>!u.online), ...HW.VACCIBOXES.filter(v=>!v.online), ...offlineGWs];

  if(allOffline.length) {
    const notifBar = document.createElement('div');
    notifBar.style.cssText='background:var(--surface);border:1px solid var(--border2);border-radius:10px;overflow:hidden;margin-bottom:20px';
    const notifHead = document.createElement('div');
    notifHead.style.cssText='padding:12px 18px;background:rgba(255,61,61,0.06);border-bottom:1px solid rgba(255,61,61,0.2);display:flex;align-items:center;gap:10px';
    notifHead.innerHTML=`<div style="font-size:16px;animation:critpulse 1.5s infinite">🔴</div><div style="font-weight:700;color:var(--red)">${allOffline.length} Device${allOffline.length>1?'s':''} Offline — LOWANONE Network Alert</div><div style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)">${new Date().toLocaleTimeString('en-KE')}</div>`;
    notifBar.appendChild(notifHead);
    const notifList = document.createElement('div');
    notifList.style.cssText='padding:8px';
    allOffline.forEach(dev => {
      const type = HW.BIOUNITS.find(u=>u.id===dev.id)?'bio':HW.VACCIBOXES.find(v=>v.id===dev.id)?'box':'gw';
      const row = document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:7px;cursor:pointer;transition:all .2s;border:1px solid transparent';
      row.innerHTML=`
        <div style="font-size:18px">${type==='bio'?'🫀':type==='box'?'📦':'📡'}</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600;color:var(--bright)">${dev.name}</div>
          <div style="font-size:11px;color:var(--muted)">${dev.county} · Last seen: <span style="color:var(--red)">${HW.fmtAgo(dev.lastSeen)}</span></div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--muted)">${dev.offlineReason?.slice(0,60)+'...'||'Unknown reason'}</div>
        </div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--cyan);padding:4px 10px;background:rgba(0,229,204,0.08);border:1px solid rgba(0,229,204,0.2);border-radius:6px;white-space:nowrap">Details →</div>`;
      row.onclick=()=>document.body.appendChild(makeDevicePanel(dev,type));
      row.onmouseenter=()=>{ row.style.background='rgba(255,255,255,0.03)'; row.style.borderColor='var(--border2)'; };
      row.onmouseleave=()=>{ row.style.background='transparent'; row.style.borderColor='transparent'; };
      notifList.appendChild(row);
    });
    notifBar.appendChild(notifList);
    el.appendChild(notifBar);
  }

  // ── Stats row ──
  const statsRow = document.createElement('div');
  statsRow.style.cssText='display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px';
  const onlineGWs=HW.GATEWAYS.filter(g=>g.online).length;
  const onlineBUs=HW.BIOUNITS.filter(u=>u.online).length;
  const onlineVBs=HW.VACCIBOXES.filter(v=>v.online).length;
  [
    {label:'Gateways Online',val:`${onlineGWs}/${HW.GATEWAYS.length}`,color:onlineGWs<HW.GATEWAYS.length?'var(--amber)':'var(--lime)'},
    {label:'BioUnits Online',val:`${onlineBUs}/${HW.BIOUNITS.length}`,color:onlineBUs<HW.BIOUNITS.length?'var(--amber)':'var(--cyan)'},
    {label:'VacciBoxes Online',val:`${onlineVBs}/${HW.VACCIBOXES.length}`,color:onlineVBs<HW.VACCIBOXES.length?'var(--amber)':'var(--blue)'},
    {label:'Network Uptime',val:'97.8%',color:'var(--lime)'},
    {label:'Packets Today',val:'14,280',color:'var(--cyan)'},
  ].forEach(s=>{
    const c=document.createElement('div');
    c.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px';
    c.innerHTML=`<div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-bottom:8px">${s.label}</div><div style="font-family:var(--mono);font-size:26px;font-weight:700;color:${s.color};letter-spacing:-1px">${s.val}</div>`;
    statsRow.appendChild(c);
  });
  el.appendChild(statsRow);

  // ── Network Map (Canvas) ──
  const mapCard = document.createElement('div');
  mapCard.style.cssText='background:var(--surface);border:1px solid var(--border2);border-radius:12px;overflow:hidden;margin-bottom:20px';
  mapCard.innerHTML=`<div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
    <div style="font-size:16px">🗺</div>
    <div style="font-weight:700;color:var(--bright)">Live Network Map — Kenya</div>
    <div style="margin-left:auto;display:flex;gap:12px;font-size:11px">
      <span style="color:var(--lime)">◉ Gateway Online</span>
      <span style="color:var(--red)">◉ Gateway Offline</span>
      <span style="color:var(--cyan)">● BioUnit</span>
      <span style="color:var(--blue)">● VacciBox</span>
    </div>
  </div>`;
  const mapBody = document.createElement('div');
  mapBody.style.cssText='position:relative';
  const mapCanvas = document.createElement('canvas');
  mapCanvas.style.cssText='width:100%;height:400px;display:block;cursor:crosshair';
  mapBody.appendChild(mapCanvas);

  // Tooltip
  const tooltip = document.createElement('div');
  tooltip.style.cssText='position:absolute;background:var(--deep);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:200px;max-width:260px';
  mapBody.appendChild(tooltip);
  mapCard.appendChild(mapBody);
  el.appendChild(mapCard);

  // Kenya outline approximate geo bounds → canvas mapping
  // Kenya: lat roughly -4.7 to 5.0, lng roughly 33.9 to 41.9
  const GEO = {latMin:-4.9, latMax:5.1, lngMin:33.8, lngMax:42.0};
  function geoToCanvas(lat,lng,w,h){
    const x=((lng-GEO.lngMin)/(GEO.lngMax-GEO.lngMin))*w;
    const y=(1-(lat-GEO.latMin)/(GEO.latMax-GEO.latMin))*h;
    return [x,y];
  }

  // Kenya simplified border (approximate)
  const KENYA_BORDER=[
    [5.0,34.0],[4.6,34.2],[4.2,34.3],[3.8,34.5],[3.5,35.0],[3.2,35.5],
    [2.9,36.0],[2.5,36.2],[1.9,37.0],[1.2,38.0],[0.5,39.0],[0.0,40.0],
    [-0.5,41.0],[-1.0,41.5],[-1.7,40.8],[-2.5,40.2],[-3.5,39.8],
    [-4.5,39.4],[-4.7,38.5],[-4.2,37.5],[-3.8,36.5],[-3.2,35.5],
    [-2.5,34.5],[-1.5,34.0],[-0.5,34.0],[0.5,33.9],[1.5,34.0],
    [2.5,34.0],[3.5,34.0],[4.3,34.0],[5.0,34.0]
  ];

  let packets2=[];
  function drawNetMap(){
    const w=mapCanvas.offsetWidth||900, h=400;
    mapCanvas.width=w; mapCanvas.height=h;
    const ctx=mapCanvas.getContext('2d');
    ctx.clearRect(0,0,w,h);

    // Background
    ctx.fillStyle='#050d18';
    ctx.fillRect(0,0,w,h);

    // Grid
    ctx.strokeStyle='rgba(19,32,48,0.8)'; ctx.lineWidth=1;
    for(let x=0;x<w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
    for(let y=0;y<h;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

    // Kenya border
    ctx.strokeStyle='rgba(0,229,204,0.25)'; ctx.lineWidth=2; ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,229,204,0.03)';
    ctx.beginPath();
    KENYA_BORDER.forEach(([lat,lng],i)=>{
      const [x,y]=geoToCanvas(lat,lng,w,h);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Cloud node (top center)
    const [cx,cy]=geoToCanvas(6.5,37.9,w,h);
    ctx.fillStyle='rgba(170,255,46,0.12)'; ctx.strokeStyle='var(--lime)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,18,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='var(--lime)'; ctx.font='bold 10px monospace'; ctx.textAlign='center';
    ctx.fillText('☁',cx,cy+4);
    ctx.font='8px monospace'; ctx.fillStyle='rgba(170,255,46,0.7)';
    ctx.fillText('LIME CLOUD',cx,cy+20);

    // Gateway ranges
    HW.GATEWAYS.forEach(gw=>{
      const [gx,gy]=geoToCanvas(gw.lat,gw.lng,w,h);
      const grad=ctx.createRadialGradient(gx,gy,0,gx,gy,90);
      const col=gw.online?'rgba(0,229,204,':'rgba(255,61,61,';
      grad.addColorStop(0,col+'0.07)'); grad.addColorStop(1,col+'0)');
      ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(gx,gy,90,0,Math.PI*2); ctx.fill();
      // GW → cloud line
      ctx.strokeStyle=gw.online?'rgba(0,229,204,0.15)':'rgba(255,61,61,0.2)';
      ctx.lineWidth=1; ctx.setLineDash([4,8]);
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(cx,cy); ctx.stroke();
      ctx.setLineDash([]);
    });

    // Device → gateway lines
    [...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const gw=HW.GATEWAYS.find(g=>g.county===dev.county)||HW.GATEWAYS[0];
      const [dx,dy]=geoToCanvas(dev.lat,dev.lng,w,h);
      const [gx,gy]=geoToCanvas(gw.lat,gw.lng,w,h);
      ctx.strokeStyle=!dev.online?'rgba(255,61,61,0.3)':dev.id.startsWith('BU')?'rgba(0,229,204,0.2)':'rgba(61,158,255,0.2)';
      ctx.lineWidth=1; ctx.setLineDash([2,5]);
      ctx.beginPath(); ctx.moveTo(dx,dy); ctx.lineTo(gx,gy); ctx.stroke();
      ctx.setLineDash([]);
    });

    // Draw gateways
    HW.GATEWAYS.forEach(gw=>{
      const [gx,gy]=geoToCanvas(gw.lat,gw.lng,w,h);
      const online=gw.online;
      ctx.fillStyle=online?'rgba(0,229,204,0.2)':'rgba(255,61,61,0.15)';
      ctx.strokeStyle=online?'var(--cyan)':'var(--red)';
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(gx,gy,12,0,Math.PI*2); ctx.fill(); ctx.stroke();
      // Pulse ring if online
      if(online){
        ctx.strokeStyle='rgba(0,229,204,0.2)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(gx,gy,18+Math.sin(Date.now()/500)*4,0,Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle=online?'var(--cyan)':'var(--red)';
      ctx.font='bold 8px monospace'; ctx.textAlign='center';
      ctx.fillText(gw.county.slice(0,6),gx,gy+26);
      // Offline X
      if(!online){
        ctx.fillStyle='var(--red)'; ctx.font='bold 14px monospace';
        ctx.fillText('×',gx,gy+5);
      }
    });

    // Draw devices
    [...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const isBio=dev.id.startsWith('BU');
      const [dx,dy]=geoToCanvas(dev.lat,dev.lng,w,h);
      const online=dev.online;
      const col=!online?'var(--red)':isBio?'var(--cyan)':'var(--blue)';
      ctx.fillStyle=col;
      ctx.shadowBlur=online?6:0; ctx.shadowColor=col;
      ctx.beginPath(); ctx.arc(dx,dy,5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      if(!online){
        ctx.strokeStyle='var(--red)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(dx,dy,8,0,Math.PI*2); ctx.stroke();
      }
    });

    // Packets
    packets2.forEach(p=>{
      ctx.fillStyle=p.type==='bio'?'var(--lime)':'var(--blue)';
      ctx.shadowBlur=8; ctx.shadowColor=ctx.fillStyle;
      ctx.beginPath(); ctx.arc(p.cx,p.cy,3,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  function spawnPacket2(){
    const all=[...HW.BIOUNITS,...HW.VACCIBOXES].filter(d=>d.online);
    if(!all.length) return;
    const dev=all[Math.floor(Math.random()*all.length)];
    const gw=HW.GATEWAYS.find(g=>g.county===dev.county)||HW.GATEWAYS[0];
    const w=mapCanvas.offsetWidth||900, h=400;
    const [sx,sy]=geoToCanvas(dev.lat,dev.lng,w,h);
    const [mx,my]=geoToCanvas(gw.lat,gw.lng,w,h);
    const [ex,ey]=geoToCanvas(6.5,37.9,w,h);
    packets2.push({sx,sy,mx,my,ex,ey,cx:sx,cy:sy,t:0,phase:'toGW',type:dev.id.startsWith('BU')?'bio':'box'});
  }

  function animateMap(){
    packets2.forEach(p=>{
      p.t+=0.03;
      if(p.phase==='toGW'&&p.t>=1){p.phase='toCloud';p.t=0;}
      if(p.phase==='toCloud'&&p.t>=1){p.done=true;}
      if(p.phase==='toGW'){p.cx=p.sx+(p.mx-p.sx)*p.t;p.cy=p.sy+(p.my-p.sy)*p.t;}
      else{p.cx=p.mx+(p.ex-p.mx)*p.t;p.cy=p.my+(p.ey-p.my)*p.t;}
    });
    packets2=packets2.filter(p=>!p.done);
    drawNetMap();
    mapAnim=requestAnimationFrame(animateMap);
  }

  // Tooltip on hover
  mapCanvas.onmousemove=(e)=>{
    const rect=mapCanvas.getBoundingClientRect();
    const mx2=(e.clientX-rect.left)*(mapCanvas.width/rect.width);
    const my2=(e.clientY-rect.top)*(mapCanvas.height/rect.height);
    const w=mapCanvas.width, h2=mapCanvas.height;
    let hit=null;
    [...HW.GATEWAYS,...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const [dx,dy]=geoToCanvas(dev.lat,dev.lng,w,h2);
      const dist=Math.sqrt((mx2-dx)**2+(my2-dy)**2);
      if(dist<20) hit=dev;
    });
    if(hit){
      tooltip.style.display='block';
      tooltip.style.left=(e.offsetX+14)+'px';
      tooltip.style.top=(e.offsetY-10)+'px';
      const isOffline=!hit.online;
      tooltip.innerHTML=`
        <div style="font-weight:700;color:var(--bright);margin-bottom:4px">${hit.name}</div>
        <div style="font-size:11px;color:${isOffline?'var(--red)':'var(--lime)'};margin-bottom:6px">● ${isOffline?'OFFLINE':'ONLINE'}</div>
        ${isOffline?`<div style="font-size:10px;color:var(--amber)">Last seen: ${HW.fmtAgo(hit.lastSeen)}</div>`:`<div style="font-size:10px;color:var(--muted)">Signal: ${hit.signal} dBm</div>`}
        ${hit.offlineReason?`<div style="font-size:10px;color:var(--muted);margin-top:4px">${hit.offlineReason.slice(0,80)}...</div>`:''}
        <div style="font-size:10px;color:var(--cyan);margin-top:6px">Click for full details →</div>`;
      mapCanvas.style.cursor='pointer';
    } else {
      tooltip.style.display='none';
      mapCanvas.style.cursor='crosshair';
    }
  };
  mapCanvas.onclick=(e)=>{
    const rect=mapCanvas.getBoundingClientRect();
    const mx2=(e.clientX-rect.left)*(mapCanvas.width/rect.width);
    const my2=(e.clientY-rect.top)*(mapCanvas.height/rect.height);
    const w=mapCanvas.width, h2=mapCanvas.height;
    [...HW.GATEWAYS,...HW.BIOUNITS,...HW.VACCIBOXES].forEach(dev=>{
      const [dx,dy]=geoToCanvas(dev.lat,dev.lng,w,h2);
      const dist=Math.sqrt((mx2-dx)**2+(my2-dy)**2);
      if(dist<20){
        const type=dev.id.startsWith('GW')?'gw':dev.id.startsWith('BU')?'bio':'box';
        document.body.appendChild(makeDevicePanel(dev,type));
      }
    });
  };

  spawnInt=setInterval(spawnPacket2,500);
  animateMap();

  // ── Device list below map ──
  const devRow = document.createElement('div');
  devRow.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:14px';
  [
    {title:'🛡 Gateways',devices:HW.GATEWAYS,type:'gw',color:'var(--cyan)'},
    {title:'🫀 BioUnits',devices:HW.BIOUNITS,type:'bio',color:'var(--lime)'},
    {title:'📦 VacciBoxes',devices:HW.VACCIBOXES,type:'box',color:'var(--blue)'},
  ].forEach(group=>{
    const c=document.createElement('div');
    c.style.cssText='background:var(--surface);border:1px solid var(--border2);border-radius:10px;overflow:hidden';
    c.innerHTML=`<div style="padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--bright)">${group.title}</div>`;
    const list=document.createElement('div');
    group.devices.forEach(dev=>{
      const row=document.createElement('div');
      const isOff=!dev.online;
      row.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(19,32,48,0.6);cursor:pointer;transition:background .15s';
      row.innerHTML=`
        <div style="width:7px;height:7px;border-radius:50%;background:${isOff?'var(--red)':'var(--lime)'};flex-shrink:0;${isOff?'':'animation:glow 2s infinite'}"></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${dev.name}</div>
          <div style="font-size:10px;color:var(--muted)">${dev.county}${isOff?' · '+HW.fmtAgo(dev.lastSeen):''}</div>
        </div>
        ${isOff?`<span style="font-family:var(--mono);font-size:9px;color:var(--red);padding:1px 6px;background:rgba(255,61,61,0.1);border-radius:5px;white-space:nowrap">OFFLINE</span>`:
        `<span style="font-family:var(--mono);font-size:9px;color:var(--lime);padding:1px 6px;background:rgba(170,255,46,0.08);border-radius:5px">LIVE</span>`}`;
      row.onmouseenter=()=>row.style.background='rgba(255,255,255,0.03)';
      row.onmouseleave=()=>row.style.background='transparent';
      row.onclick=()=>document.body.appendChild(makeDevicePanel(dev,group.type));
      list.appendChild(row);
    });
    c.appendChild(list);
    devRow.appendChild(c);
  });
  el.appendChild(devRow);

  el._cleanup=()=>{ cancelAnimationFrame(mapAnim); clearInterval(spawnInt); };
}
// ── BOOT ───────────────────────────────────────────────────────
renderLogin();
</script>
</body>
